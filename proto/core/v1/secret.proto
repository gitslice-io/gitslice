syntax = "proto3";

package gitslice.core.v1;

import "proto/core/v1/common.proto";

option go_package = "gitslice.io/gitslice/proto/core/v1;corev1";

// SecretService manages an account's secrets: values Gitslice keeps encrypted
// and passes to the CI checks of the slices each one is scoped to, as
// environment variables (design/33_secrets.md). Only the account's owners and
// admins manage them, and no call ever returns a value.
service SecretService {
  // ListSecrets lists an account's secrets with their scopes, by name.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc GetSecret(GetSecretRequest) returns (Secret);
  // CreateSecret stores a new secret. It fails with FailedPrecondition when a
  // slice in its scope already has a secret by that name, or, for all_slices,
  // when the account already has an all_slices secret by that name.
  rpc CreateSecret(CreateSecretRequest) returns (Secret);
  // UpdateSecret replaces the value, the scope, or both; what is left unset
  // stays as it is.
  rpc UpdateSecret(UpdateSecretRequest) returns (Secret);
  rpc DeleteSecret(DeleteSecretRequest) returns (Empty);
}

message Secret {
  string id = 1;
  // The account that owns it.
  string account = 2;
  // The environment variable name, ^[A-Z_][A-Z0-9_]*$. It never changes.
  string name = 3;
  SecretScope scope = 4;
  // Usernames.
  string created_by = 5;
  string updated_by = 6;
  // RFC 3339.
  string created_at = 7;
  string updated_at = 8;
}

// SecretScope is where a secret applies: every slice of its account, or the
// slices listed. It reaches every CI daemon that runs checks for those slices,
// and every writer of those slices can read it from a check, so widen it with
// care.
message SecretScope {
  bool all_slices = 1;
  // Slices of the secret's account; ignored when all_slices. A secret whose
  // slices were all deleted has none and reaches nothing.
  repeated SliceRef slices = 2;
}

message ListSecretsRequest {
  string account = 1;
}

message ListSecretsResponse {
  repeated Secret secrets = 1;
}

message GetSecretRequest {
  string id = 1;
}

message CreateSecretRequest {
  string account = 1;
  string name = 2;
  // At most 48 KiB.
  string value = 3;
  // Required: all_slices, or at least one slice.
  SecretScope scope = 4;
}

message UpdateSecretRequest {
  string id = 1;
  // Unset keeps the value.
  optional string value = 2;
  // Unset keeps the scope.
  SecretScope scope = 3;
}

message DeleteSecretRequest {
  string id = 1;
}
