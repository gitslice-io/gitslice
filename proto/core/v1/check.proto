syntax = "proto3";

package gitslice.core.v1;

option go_package = "gitslice.io/gitslice/proto/core/v1;corev1";

service CheckService {
  rpc ListCheckRuns(ListCheckRunsRequest) returns (ListCheckRunsResponse);
  rpc GetCheckRun(GetCheckRunRequest) returns (CheckRun);
  rpc RerunCheck(RerunCheckRequest) returns (CheckRun);
  rpc StreamCheckRun(StreamCheckRunRequest) returns (stream CheckRunLog);
}

message CheckRun {
  string id = 1;
  string changeset_id = 2;
  string patchset_id = 3;
  string check_name = 4;
  string daemon_id = 5;
  string provenance = 6;
  int32 attempt = 7;
  string status = 8;
  int32 exit_code = 9;
  string summary = 10;
  string started_at = 11;
  string finished_at = 12;
  int64 duration_ms = 13;
  string created_at = 14;
  // daemon_name is the name daemon_id is shown by; "" when there is none.
  string daemon_name = 15;
  // daemon_online says whether daemon_id is connected now, and
  // daemon_last_seen_at when it last was, so a queued run can say what it
  // waits for.
  bool daemon_online = 16;
  string daemon_last_seen_at = 17;
  // Set when a trigger reports the check (design/34_triggers.md): the run
  // that reports it, a link to more detail, and findings on lines of files.
  // provenance is then "trigger".
  string trigger_run_id = 18;
  string details_url = 19;
  repeated CheckAnnotation annotations = 20;
}

// CheckAnnotation points a check's finding at lines of a file.
message CheckAnnotation {
  // Canonical path, such as /acme/web/src/app.ts.
  string path = 1;
  int32 start_line = 2;
  int32 end_line = 3;
  // notice, warning or failure.
  string level = 4;
  string message = 5;
}

message CheckRunLog {
  string run_id = 1;
  int64 seq = 2;
  string stream = 3;
  string chunk = 4;
  string created_at = 5;
}

message ListCheckRunsRequest {
  string changeset_id = 1;
  string patchset_id = 2;
}

message ListCheckRunsResponse {
  repeated CheckRun runs = 1;
}

message GetCheckRunRequest {
  string run_id = 1;
}

message RerunCheckRequest {
  string run_id = 1;
}

message StreamCheckRunRequest {
  string run_id = 1;
  int64 after_seq = 2;
}
