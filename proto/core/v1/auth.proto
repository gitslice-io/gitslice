syntax = "proto3";

package gitslice.core.v1;

option go_package = "github.com/gitslice-io/gitslice/proto/core/v1;corev1";

service AuthService {
  rpc StartCliLogin(StartCliLoginRequest) returns (StartCliLoginResponse);
  rpc PollCliLogin(PollCliLoginRequest) returns (PollCliLoginResponse);
  rpc CompleteCliLogin(CompleteCliLoginRequest) returns (CompleteCliLoginResponse);
  rpc GetAuthStatus(GetAuthStatusRequest) returns (GetAuthStatusResponse);
  rpc CheckUsernameAvailable(CheckUsernameAvailableRequest) returns (CheckUsernameAvailableResponse);
  rpc ChooseUsername(ChooseUsernameRequest) returns (ChooseUsernameResponse);
}

message StartCliLoginRequest {}

message StartCliLoginResponse {
  string code = 1;
  string expires_at = 2;
  int32 poll_interval_seconds = 3;
}

message PollCliLoginRequest {
  string code = 1;
}

message PollCliLoginResponse {
  string status = 1;
  string token = 2;
  string subject_id = 3;
}

message CompleteCliLoginRequest {
  string code = 1;
}

message CompleteCliLoginResponse {
  string subject_id = 1;
}

message GetAuthStatusRequest {}

message GetAuthStatusResponse {
  string subject_id = 1;
  // Account slugs the authenticated subject belongs to. The first is the
  // subject's personal account, whose "home" slice covers "/<account>".
  repeated string accounts = 2;
  // True when the subject has no personal account yet and must choose a
  // username before using account-scoped features.
  bool needs_username = 3;
}

message CheckUsernameAvailableRequest {
  string username = 1;
}

message CheckUsernameAvailableResponse {
  bool available = 1;
  // The normalized username that would be used (lowercased, '_' -> '-').
  string normalized = 2;
  // When not available or invalid, a short human-readable reason (e.g.
  // "username is taken", or a validation message). Empty when available.
  string reason = 3;
}

message ChooseUsernameRequest {
  string username = 1;
}

message ChooseUsernameResponse {
  string subject_id = 1;
  // The chosen personal account slug.
  string account = 2;
}
