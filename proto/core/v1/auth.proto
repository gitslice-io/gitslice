syntax = "proto3";

package gitslice.core.v1;

option go_package = "github.com/gitslice-io/gitslice/proto/core/v1;corev1";

service AuthService {
  rpc StartCliLogin(StartCliLoginRequest) returns (StartCliLoginResponse);
  rpc PollCliLogin(PollCliLoginRequest) returns (PollCliLoginResponse);
  rpc CompleteCliLogin(CompleteCliLoginRequest) returns (CompleteCliLoginResponse);
  rpc GetAuthStatus(GetAuthStatusRequest) returns (GetAuthStatusResponse);
  rpc CheckUsernameAvailable(CheckUsernameAvailableRequest) returns (CheckUsernameAvailableResponse);
  rpc ChooseUsername(ChooseUsernameRequest) returns (ChooseUsernameResponse);
  // RegisterAgent self-registers an agent with its own personal account and
  // returns a long-lived API key. Unauthenticated; disabled unless the server
  // sets GITSLICE_AGENT_SIGNUP_ENABLED. See design/20_agent_signup_and_claim.md.
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  // ListPendingClaims lists agent registrations the caller may claim: unclaimed
  // agents whose owner email is one of the caller's verified emails.
  rpc ListPendingClaims(ListPendingClaimsRequest) returns (ListPendingClaimsResponse);
  // AcceptClaim makes the caller an owner of the agent's account. The agent
  // keeps its own access, so the account becomes co-owned.
  rpc AcceptClaim(AcceptClaimRequest) returns (AcceptClaimResponse);
}

message StartCliLoginRequest {}

message StartCliLoginResponse {
  string code = 1;
  string expires_at = 2;
  int32 poll_interval_seconds = 3;
}

message PollCliLoginRequest {
  string code = 1;
}

message PollCliLoginResponse {
  string status = 1;
  string token = 2;
  string subject_id = 3;
}

message CompleteCliLoginRequest {
  string code = 1;
}

message CompleteCliLoginResponse {
  string subject_id = 1;
}

message GetAuthStatusRequest {}

message GetAuthStatusResponse {
  string subject_id = 1;
  // Account slugs the authenticated subject belongs to. The first is the
  // subject's personal account, whose "home" slice covers "/<account>".
  repeated string accounts = 2;
  // True when the subject has no personal account yet and must choose a
  // username before using account-scoped features.
  bool needs_username = 3;
}

message CheckUsernameAvailableRequest {
  string username = 1;
}

message CheckUsernameAvailableResponse {
  bool available = 1;
  // The normalized username that would be used (lowercased, '_' -> '-').
  string normalized = 2;
  // When not available or invalid, a short human-readable reason (e.g.
  // "username is taken", or a validation message). Empty when available.
  string reason = 3;
}

message ChooseUsernameRequest {
  string username = 1;
}

message ChooseUsernameResponse {
  string subject_id = 1;
  // The chosen personal account slug.
  string account = 2;
}

message RegisterAgentRequest {
  // Desired username; same rules as ChooseUsername.
  string username = 1;
  // Email of the human who may later claim co-ownership. Required. Not verified
  // at registration; a claim requires a verified sign-in with this address.
  string owner_email = 2;
  // Optional human-readable name, e.g. "release-bot". Defaults to username.
  string display_name = 3;
}

message RegisterAgentResponse {
  string subject_id = 1;
  string account = 2;
  // Plaintext API key ("gsk_..."). Returned only once; the server keeps a hash.
  string api_key = 3;
}

message PendingClaim {
  string agent_subject_id = 1;
  string agent_display_name = 2;
  string account = 3;
  string owner_email = 4;
  // RFC 3339 registration time.
  string created_at = 5;
}

message ListPendingClaimsRequest {}

message ListPendingClaimsResponse {
  repeated PendingClaim claims = 1;
}

message AcceptClaimRequest {
  string agent_subject_id = 1;
}

message AcceptClaimResponse {
  // The claimed account, now co-owned by the caller.
  string account = 1;
}
