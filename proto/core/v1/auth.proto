syntax = "proto3";

package gitslice.core.v1;

import "proto/core/v1/common.proto";

option go_package = "gitslice.io/gitslice/proto/core/v1;corev1";

service AuthService {
  rpc StartCliLogin(StartCliLoginRequest) returns (StartCliLoginResponse);
  rpc PollCliLogin(PollCliLoginRequest) returns (PollCliLoginResponse);
  rpc CompleteCliLogin(CompleteCliLoginRequest) returns (CompleteCliLoginResponse);
  rpc GetAuthStatus(GetAuthStatusRequest) returns (GetAuthStatusResponse);
  rpc CheckUsernameAvailable(CheckUsernameAvailableRequest) returns (CheckUsernameAvailableResponse);
  rpc ChooseUsername(ChooseUsernameRequest) returns (ChooseUsernameResponse);
  // RegisterAgent self-registers an agent with its own personal account and
  // returns a long-lived API key. Unauthenticated; disabled unless the server
  // sets GITSLICE_AGENT_SIGNUP_ENABLED. See design/20_agent_signup_and_claim.md.
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  // ListPendingClaims lists agent registrations the caller may claim: unclaimed
  // agents whose owner email is one of the caller's verified emails.
  rpc ListPendingClaims(ListPendingClaimsRequest) returns (ListPendingClaimsResponse);
  // AcceptClaim makes the caller an owner of the agent's account. The agent
  // keeps its own access, so the account becomes co-owned.
  rpc AcceptClaim(AcceptClaimRequest) returns (AcceptClaimResponse);
  // ListOwnedAgents lists the self-registered agents whose accounts the caller
  // owns (typically after AcceptClaim), with basic activity.
  rpc ListOwnedAgents(ListOwnedAgentsRequest) returns (ListOwnedAgentsResponse);
  // ListApiKeys lists an agent's API keys (never their secrets). The caller is
  // the agent itself, or an owner of the agent's account (after AcceptClaim).
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);
  // CreateApiKey issues a new API key for an agent and returns its secret once.
  // This is how a lost key is replaced: an owner of the agent's account creates
  // one and hands it to the agent, then revokes the lost one. Same callers as
  // ListApiKeys.
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  // RevokeApiKey ends an API key at once. Same callers as ListApiKeys.
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
  // CreateOrganization creates an organization account (with a private home
  // slice). Any signed-in user with a personal account may create one and
  // becomes its only owner; names reserved for sign-up are refused, and a user
  // owns at most 20 organizations they created. Operators (the server's
  // GITSLICE_OPERATOR_SUBJECTS) may use reserved names and name other owners.
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  // ListAccountMembers lists an account's members. Any member may call it.
  rpc ListAccountMembers(ListAccountMembersRequest) returns (ListAccountMembersResponse);
  // SetAccountMember changes a member's role. Owners and admins may call it;
  // only owners grant or revoke owner. Adding someone who is not a member is
  // for operators only; everyone else invites them (InviteAccountMember).
  rpc SetAccountMember(SetAccountMemberRequest) returns (SetAccountMemberResponse);
  // RemoveAccountMember removes a user from an organization. The last owner
  // cannot be removed.
  rpc RemoveAccountMember(RemoveAccountMemberRequest) returns (RemoveAccountMemberResponse);
  // InviteAccountMember invites a user to an organization with a role. They
  // become a member only when they accept. Owners and admins may invite;
  // only owners invite owners. Inviting someone already invited replaces the
  // invitation's role.
  rpc InviteAccountMember(InviteAccountMemberRequest) returns (InviteAccountMemberResponse);
  // ListAccountInvitations lists an organization's pending invitations, for
  // its owners and admins.
  rpc ListAccountInvitations(ListAccountInvitationsRequest) returns (ListAccountInvitationsResponse);
  // ListMyInvitations lists the caller's pending invitations.
  rpc ListMyInvitations(ListMyInvitationsRequest) returns (ListMyInvitationsResponse);
  // RespondToInvitation accepts or declines the caller's invitation to an
  // organization. Either way the invitation is gone afterwards.
  rpc RespondToInvitation(RespondToInvitationRequest) returns (RespondToInvitationResponse);
  // CancelAccountInvitation withdraws a pending invitation. Owners and admins
  // may call it.
  rpc CancelAccountInvitation(CancelAccountInvitationRequest) returns (CancelAccountInvitationResponse);
  // GetAccountProfile returns an account's public profile. Anyone may call it,
  // signed in or not.
  rpc GetAccountProfile(GetAccountProfileRequest) returns (AccountProfile);
  // UpdateAccountProfile changes an account's profile: an organization's by
  // its owners and admins, a personal account's by its person.
  rpc UpdateAccountProfile(UpdateAccountProfileRequest) returns (AccountProfile);
  // SetAccountAvatar uploads an account's picture, or with no image removes
  // it, so the account shows its generated pixel picture again. The same
  // people as UpdateAccountProfile may call it. Anyone reads a picture at
  // GET /avatars/{account}.png.
  rpc SetAccountAvatar(SetAccountAvatarRequest) returns (AccountProfile);
  // CreateDelegatedAgent creates an agent owned and controlled by the signed-in
  // human caller, optionally adds it to a slice with a role, and returns its
  // initial API key once.
  rpc CreateDelegatedAgent(CreateDelegatedAgentRequest) returns (CreateDelegatedAgentResponse);
  // CreateGroup creates an account-level group (@account/name). Account owners
  // and admins may call it.
  rpc CreateGroup(CreateGroupRequest) returns (AccountGroup);
  // GetGroup returns one account group and its members. Account members and
  // slice admins referencing the account's groups may call it.
  rpc GetGroup(GetGroupRequest) returns (AccountGroup);
  // ListGroups lists an account's groups. Account members and slice admins
  // in the account may call it.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  // DeleteGroup removes an account group and any slice grants referencing it.
  rpc DeleteGroup(DeleteGroupRequest) returns (Empty);
  // AddGroupMember adds a user or agent subject to an account group.
  rpc AddGroupMember(AddGroupMemberRequest) returns (AccountGroup);
  // RemoveGroupMember removes a user or agent subject from an account group.
  rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (AccountGroup);
}

message StartCliLoginRequest {}

message StartCliLoginResponse {
  string code = 1;
  string expires_at = 2;
  int32 poll_interval_seconds = 3;
}

message PollCliLoginRequest {
  string code = 1;
}

message PollCliLoginResponse {
  string status = 1;
  string token = 2;
  string subject_id = 3;
}

message CompleteCliLoginRequest {
  string code = 1;
}

message CompleteCliLoginResponse {
  string subject_id = 1;
}

message GetAuthStatusRequest {}

message GetAuthStatusResponse {
  string subject_id = 1;
  // Account slugs the authenticated subject belongs to. The first is the
  // subject's personal account, whose "home" slice covers "/<account>".
  repeated string accounts = 2;
  // True when the subject has no personal account yet and must choose a
  // username before using account-scoped features.
  bool needs_username = 3;
  // The same accounts, in the same order, with what each is and the
  // subject's role in it, so a client can offer them as contexts to switch
  // between.
  repeated AccountMembership memberships = 4;
}

message AccountMembership {
  string account = 1;
  // personal (the subject's own account), organization, or agent (the
  // personal account of an agent the subject claimed).
  string kind = 2;
  // owner, admin, writer, member or reader.
  string role = 3;
}

message CheckUsernameAvailableRequest {
  string username = 1;
}

message CheckUsernameAvailableResponse {
  bool available = 1;
  // The normalized username that would be used (lowercased, '_' -> '-').
  string normalized = 2;
  // When not available or invalid, a short human-readable reason (e.g.
  // "username is taken", or a validation message). Empty when available.
  string reason = 3;
}

message ChooseUsernameRequest {
  string username = 1;
}

message ChooseUsernameResponse {
  string subject_id = 1;
  // The chosen personal account slug.
  string account = 2;
}

message RegisterAgentRequest {
  // Desired username; same rules as ChooseUsername.
  string username = 1;
  // Email of the human who may later claim co-ownership. Required. Not verified
  // at registration; a claim requires a verified sign-in with this address.
  string owner_email = 2;
  // Optional human-readable name, e.g. "release-bot". Defaults to username.
  string display_name = 3;
  // Optional client-generated secret (at least 32 characters) that makes the
  // call safely retryable. If a registration already exists for this token and
  // the same username and owner email, the server resumes it: it returns the
  // same agent with a fresh API key and revokes that agent's never-used keys.
  // Clients should persist it until they receive a response.
  string registration_token = 4;
}

message RegisterAgentResponse {
  string subject_id = 1;
  string account = 2;
  // Plaintext API key ("gsk_..."). Returned only once; the server keeps a hash.
  string api_key = 3;
}

message PendingClaim {
  string agent_subject_id = 1;
  string agent_display_name = 2;
  string account = 3;
  string owner_email = 4;
  // RFC 3339 registration time.
  string created_at = 5;
}

message ListPendingClaimsRequest {}

message ListPendingClaimsResponse {
  repeated PendingClaim claims = 1;
  // The caller's own verified emails, which the claims above were matched
  // against (freshly read from the identity provider). An agent registered
  // with any other address cannot be claimed by this account, so clients show
  // these when the list is empty.
  repeated string verified_emails = 2;
}

message AcceptClaimRequest {
  string agent_subject_id = 1;
}

message AcceptClaimResponse {
  // The claimed account, now co-owned by the caller.
  string account = 1;
}

message OwnedAgent {
  string agent_subject_id = 1;
  string agent_display_name = 2;
  // The agent's personal account, co-owned by the caller.
  string account = 3;
  // RFC 3339 times; claimed_at is empty if the caller owns it without a claim,
  // last_active_at is empty if the agent's API keys were never used.
  string registered_at = 4;
  string claimed_at = 5;
  string last_active_at = 6;
}

message ListOwnedAgentsRequest {}

message ListOwnedAgentsResponse {
  repeated OwnedAgent agents = 1;
}

message CreateOrganizationRequest {
  // Account slug, e.g. "gitslice". Same syntax rules as usernames.
  string slug = 1;
  // Usernames of the initial owners; defaults to the caller.
  repeated string owner_usernames = 2;
}

message CreateOrganizationResponse {
  string account = 1;
  repeated AccountMember members = 2;
}

message AccountMember {
  // The member's username (personal account slug); empty if they have none.
  string username = 1;
  string subject_id = 2;
  // owner, admin, writer, member or reader.
  string role = 3;
  // The display name on the member's own account profile, when they set one.
  string display_name = 4;
  // person or agent.
  string kind = 5;
}

message ListAccountMembersRequest {
  string account = 1;
}

message ListAccountMembersResponse {
  string account = 1;
  // personal or organization.
  string kind = 2;
  repeated AccountMember members = 3;
}

message SetAccountMemberRequest {
  string account = 1;
  string username = 2;
  string role = 3;
}

message SetAccountMemberResponse {
  AccountMember member = 1;
}

message RemoveAccountMemberRequest {
  string account = 1;
  string username = 2;
}

message RemoveAccountMemberResponse {}

message AccountInvitation {
  string account = 1;
  // The invited user's username.
  string username = 2;
  // owner, admin, writer, member or reader.
  string role = 3;
  // Username of whoever sent the invitation.
  string invited_by = 4;
  // RFC 3339.
  string created_at = 5;
}

message InviteAccountMemberRequest {
  string account = 1;
  string username = 2;
  string role = 3;
}

message InviteAccountMemberResponse {
  AccountInvitation invitation = 1;
}

message ListAccountInvitationsRequest {
  string account = 1;
}

message ListAccountInvitationsResponse {
  repeated AccountInvitation invitations = 1;
}

message ListMyInvitationsRequest {}

message ListMyInvitationsResponse {
  repeated AccountInvitation invitations = 1;
}

message RespondToInvitationRequest {
  string account = 1;
  bool accept = 2;
}

message RespondToInvitationResponse {
  // The caller's new membership, when they accepted.
  AccountMembership membership = 1;
}

message CancelAccountInvitationRequest {
  string account = 1;
  string username = 2;
}

message CancelAccountInvitationResponse {}

message AccountProfile {
  string account = 1;
  // personal or organization.
  string kind = 2;
  // At most 64 characters; empty when not set.
  string display_name = 3;
  // At most 280 characters.
  string description = 4;
  // An http or https URL, at most 200 characters.
  string website = 5;
  // RFC 3339.
  string created_at = 6;
  // Names the uploaded picture; empty when the account shows its generated
  // pixel picture. Clients add it to the picture's address
  // (/avatars/{account}.png?v=...), so a new upload is a new address.
  string avatar_version = 7;
}

message GetAccountProfileRequest {
  string account = 1;
}

message SetAccountAvatarRequest {
  string account = 1;
  // A PNG, JPEG, GIF or WebP file of at most 5 MB, stored as its largest
  // centered square at 256x256. Empty removes the uploaded picture.
  bytes image = 2;
}

message UpdateAccountProfileRequest {
  string account = 1;
  string display_name = 2;
  string description = 3;
  string website = 4;
}

// ApiKey describes an API key. It never carries the secret.
message ApiKey {
  string id = 1;
  string name = 2;
  string created_at = 3;
  // Empty until the key is first used.
  string last_used_at = 4;
  // Empty unless the key has an expiry.
  string expires_at = 5;
  // Empty unless the key was revoked.
  string revoked_at = 6;
  // Slice IDs this key is limited to; empty when unrestricted.
  repeated string slice_ids = 7;
  // Human-readable "<account>/<slice>" refs corresponding to slice_ids.
  repeated string slices = 8;
  // Role ceiling ("reader", "contributor", or "writer"); empty when uncapped.
  string max_role = 9;
  // Set when this key was minted from another API key.
  string parent_key_id = 10;
  // Optional purpose note (e.g. "daemon my-ci", "conversation cv_...").
  string purpose = 11;
  // Optional daemon id associated with this key.
  string daemon_id = 12;
  // Optional conversation id associated with this key.
  string conversation_id = 13;
}

message ListApiKeysRequest {
  // The agent's account (username). Empty means the caller.
  string agent = 1;
}

message ListApiKeysResponse {
  string agent_subject_id = 1;
  string account = 2;
  repeated ApiKey keys = 3;
}

message CreateApiKeyRequest {
  // The agent's account (username). Empty means the caller (user or agent).
  string agent = 1;
  // A label for the key, up to 64 characters. Defaults to "key".
  string name = 2;
  // Optional "<account>/<slice>" (or "<account>:<slice>") refs to limit this key to.
  repeated string slices = 3;
  // Optional role ceiling: "reader", "contributor", or "writer".
  string max_role = 4;
  // Optional lifetime in seconds from creation; <= 0 means no explicit expiry.
  int64 expires_in_seconds = 5;
  // Optional purpose note.
  string purpose = 6;
  // Optional daemon id.
  string daemon_id = 7;
  // Optional conversation id.
  string conversation_id = 8;
}

message CreateApiKeyResponse {
  ApiKey key = 1;
  // The key itself. Returned only here, once; the server keeps only a hash.
  string secret = 2;
  string agent_subject_id = 3;
  string account = 4;
}

message RevokeApiKeyRequest {
  // The agent's account (username). Empty means the caller.
  string agent = 1;
  string key_id = 2;
}

message RevokeApiKeyResponse {
  ApiKey key = 1;
}

message CreateDelegatedAgentRequest {
  string username = 1;
  string display_name = 2;
  SliceRef slice = 3;
  // Slice role when slice is set: "reader", "contributor" (default),
  // "writer", or "admin".
  string role = 4;
}

message CreateDelegatedAgentResponse {
  string agent_subject_id = 1;
  string account = 2;
  ApiKey key = 3;
  string secret = 4;
  SliceRef slice = 5;
  string role = 6;
}

message AccountGroupMember {
  string username = 1;
  string subject_id = 2;
  string display_name = 3;
  // person or agent.
  string kind = 4;
  string added_by = 5;
  string created_at = 6;
}

message AccountGroup {
  string id = 1;
  string account = 2;
  string name = 3;
  // Canonical "@account/name" reference.
  string handle = 4;
  string description = 5;
  string created_by = 6;
  string created_at = 7;
  string updated_at = 8;
  repeated AccountGroupMember members = 9;
  int32 member_count = 10;
}

message CreateGroupRequest {
  string account = 1;
  string name = 2;
  string description = 3;
}

message GetGroupRequest {
  string account = 1;
  string name = 2;
}

message ListGroupsRequest {
  string account = 1;
}

message ListGroupsResponse {
  string account = 1;
  repeated AccountGroup groups = 2;
}

message DeleteGroupRequest {
  string account = 1;
  string name = 2;
}

message AddGroupMemberRequest {
  string account = 1;
  string name = 2;
  string username = 3;
}

message RemoveGroupMemberRequest {
  string account = 1;
  string name = 2;
  string username = 3;
}
