syntax = "proto3";

package gitslice.core.v1;

option go_package = "github.com/gitslice-io/gitslice/proto/core/v1;corev1";

service FakeAccountService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ApproveSignup(ApproveSignupRequest) returns (ApproveSignupResponse);
}

service AuthService {
  rpc GetAuthStatus(GetAuthStatusRequest) returns (GetAuthStatusResponse);
}

message LoginRequest {
  string dev_user = 1;
}

message LoginResponse {
  string token = 1;
  string subject_id = 2;
}

message ApproveSignupRequest {
  string username = 1;
  string callback_url = 2;
  string state = 3;
}

message ApproveSignupResponse {
  string token = 1;
  string subject_id = 2;
  string redirect_url = 3;
}

message GetAuthStatusRequest {}

message GetAuthStatusResponse {
  string subject_id = 1;
}
