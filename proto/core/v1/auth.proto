syntax = "proto3";

package gitslice.core.v1;

option go_package = "gitslice.io/gitslice/proto/core/v1;corev1";

service AuthService {
  rpc StartCliLogin(StartCliLoginRequest) returns (StartCliLoginResponse);
  rpc PollCliLogin(PollCliLoginRequest) returns (PollCliLoginResponse);
  rpc CompleteCliLogin(CompleteCliLoginRequest) returns (CompleteCliLoginResponse);
  rpc GetAuthStatus(GetAuthStatusRequest) returns (GetAuthStatusResponse);
  rpc CheckUsernameAvailable(CheckUsernameAvailableRequest) returns (CheckUsernameAvailableResponse);
  rpc ChooseUsername(ChooseUsernameRequest) returns (ChooseUsernameResponse);
  // RegisterAgent self-registers an agent with its own personal account and
  // returns a long-lived API key. Unauthenticated; disabled unless the server
  // sets GITSLICE_AGENT_SIGNUP_ENABLED. See design/20_agent_signup_and_claim.md.
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  // ListPendingClaims lists agent registrations the caller may claim: unclaimed
  // agents whose owner email is one of the caller's verified emails.
  rpc ListPendingClaims(ListPendingClaimsRequest) returns (ListPendingClaimsResponse);
  // AcceptClaim makes the caller an owner of the agent's account. The agent
  // keeps its own access, so the account becomes co-owned.
  rpc AcceptClaim(AcceptClaimRequest) returns (AcceptClaimResponse);
  // ListOwnedAgents lists the self-registered agents whose accounts the caller
  // owns (typically after AcceptClaim), with basic activity.
  rpc ListOwnedAgents(ListOwnedAgentsRequest) returns (ListOwnedAgentsResponse);
  // CreateOrganization creates an organization account (with a private home
  // slice) owned by the given users. Operator-only: the caller's subject must
  // be listed in the server's GITSLICE_OPERATOR_SUBJECTS. Operators may use
  // names reserved for self-service sign-up.
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  // ListAccountMembers lists an account's members. Any member may call it.
  rpc ListAccountMembers(ListAccountMembersRequest) returns (ListAccountMembersResponse);
  // SetAccountMember adds a user to an organization or changes their role.
  // Owners and admins may call it; only owners grant or revoke owner.
  rpc SetAccountMember(SetAccountMemberRequest) returns (SetAccountMemberResponse);
  // RemoveAccountMember removes a user from an organization. The last owner
  // cannot be removed.
  rpc RemoveAccountMember(RemoveAccountMemberRequest) returns (RemoveAccountMemberResponse);
}

message StartCliLoginRequest {}

message StartCliLoginResponse {
  string code = 1;
  string expires_at = 2;
  int32 poll_interval_seconds = 3;
}

message PollCliLoginRequest {
  string code = 1;
}

message PollCliLoginResponse {
  string status = 1;
  string token = 2;
  string subject_id = 3;
}

message CompleteCliLoginRequest {
  string code = 1;
}

message CompleteCliLoginResponse {
  string subject_id = 1;
}

message GetAuthStatusRequest {}

message GetAuthStatusResponse {
  string subject_id = 1;
  // Account slugs the authenticated subject belongs to. The first is the
  // subject's personal account, whose "home" slice covers "/<account>".
  repeated string accounts = 2;
  // True when the subject has no personal account yet and must choose a
  // username before using account-scoped features.
  bool needs_username = 3;
}

message CheckUsernameAvailableRequest {
  string username = 1;
}

message CheckUsernameAvailableResponse {
  bool available = 1;
  // The normalized username that would be used (lowercased, '_' -> '-').
  string normalized = 2;
  // When not available or invalid, a short human-readable reason (e.g.
  // "username is taken", or a validation message). Empty when available.
  string reason = 3;
}

message ChooseUsernameRequest {
  string username = 1;
}

message ChooseUsernameResponse {
  string subject_id = 1;
  // The chosen personal account slug.
  string account = 2;
}

message RegisterAgentRequest {
  // Desired username; same rules as ChooseUsername.
  string username = 1;
  // Email of the human who may later claim co-ownership. Required. Not verified
  // at registration; a claim requires a verified sign-in with this address.
  string owner_email = 2;
  // Optional human-readable name, e.g. "release-bot". Defaults to username.
  string display_name = 3;
  // Optional client-generated secret (at least 32 characters) that makes the
  // call safely retryable. If a registration already exists for this token and
  // the same username and owner email, the server resumes it: it returns the
  // same agent with a fresh API key and revokes that agent's never-used keys.
  // Clients should persist it until they receive a response.
  string registration_token = 4;
}

message RegisterAgentResponse {
  string subject_id = 1;
  string account = 2;
  // Plaintext API key ("gsk_..."). Returned only once; the server keeps a hash.
  string api_key = 3;
}

message PendingClaim {
  string agent_subject_id = 1;
  string agent_display_name = 2;
  string account = 3;
  string owner_email = 4;
  // RFC 3339 registration time.
  string created_at = 5;
}

message ListPendingClaimsRequest {}

message ListPendingClaimsResponse {
  repeated PendingClaim claims = 1;
}

message AcceptClaimRequest {
  string agent_subject_id = 1;
}

message AcceptClaimResponse {
  // The claimed account, now co-owned by the caller.
  string account = 1;
}

message OwnedAgent {
  string agent_subject_id = 1;
  string agent_display_name = 2;
  // The agent's personal account, co-owned by the caller.
  string account = 3;
  // RFC 3339 times; claimed_at is empty if the caller owns it without a claim,
  // last_active_at is empty if the agent's API keys were never used.
  string registered_at = 4;
  string claimed_at = 5;
  string last_active_at = 6;
}

message ListOwnedAgentsRequest {}

message ListOwnedAgentsResponse {
  repeated OwnedAgent agents = 1;
}

message CreateOrganizationRequest {
  // Account slug, e.g. "gitslice". Same syntax rules as usernames.
  string slug = 1;
  // Usernames of the initial owners; defaults to the caller.
  repeated string owner_usernames = 2;
}

message CreateOrganizationResponse {
  string account = 1;
  repeated AccountMember members = 2;
}

message AccountMember {
  // The member's username (personal account slug); empty if they have none.
  string username = 1;
  string subject_id = 2;
  // owner, admin, writer, member or reader.
  string role = 3;
}

message ListAccountMembersRequest {
  string account = 1;
}

message ListAccountMembersResponse {
  string account = 1;
  // personal or organization.
  string kind = 2;
  repeated AccountMember members = 3;
}

message SetAccountMemberRequest {
  string account = 1;
  string username = 2;
  string role = 3;
}

message SetAccountMemberResponse {
  AccountMember member = 1;
}

message RemoveAccountMemberRequest {
  string account = 1;
  string username = 2;
}

message RemoveAccountMemberResponse {}
