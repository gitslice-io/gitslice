syntax = "proto3";

package gitslice.core.v1;

import "proto/core/v1/common.proto";

option go_package = "gitslice.io/gitslice/proto/core/v1;corev1";

service SliceService {
  rpc CreateSlice(CreateSliceRequest) returns (Slice);
  rpc ResolveSlice(ResolveSliceRequest) returns (Slice);
  rpc GetSlice(GetSliceRequest) returns (Slice);
  rpc ListSlices(ListSlicesRequest) returns (ListSlicesResponse);
  rpc ListSliceDefinitionVersions(ListSliceDefinitionVersionsRequest) returns (ListSliceDefinitionVersionsResponse);
  rpc UpdateSliceDefinition(UpdateSliceDefinitionRequest) returns (SliceDefinition);
  rpc SetSliceCIDaemon(SetSliceCIDaemonRequest) returns (Slice);
  // SetSliceSecret sets the value of the secret NAME on this slice's
  // included paths, creating one there if there is none
  // (design/33_secrets.md). It fails with FailedPrecondition when NAME comes
  // from a secret that also applies to other folders: change that one with
  // SecretService instead.
  rpc SetSliceSecret(SetSliceSecretRequest) returns (Empty);
  // DeleteSliceSecret deletes the secret NAME on this slice's included paths,
  // or takes those paths out of a secret that has others. A secret on a
  // folder above the slice, such as the account root, cannot be removed here.
  rpc DeleteSliceSecret(DeleteSliceSecretRequest) returns (Empty);
  // ListSliceSecrets lists the names of the secrets that apply anywhere in
  // the slice.
  rpc ListSliceSecrets(ListSliceSecretsRequest) returns (ListSliceSecretsResponse);
  // DeleteSlice removes a slice. One that has changesets is removed too when
  // none of them is open and every path it includes is still covered by
  // another slice: the changesets stay (history stays on the paths) and the
  // name stays reserved.
  rpc DeleteSlice(DeleteSliceRequest) returns (DeleteSliceResponse);
  // RenameSlice gives a slice a new name in its account. History, members,
  // settings and changesets move with it. The old name keeps resolving to the
  // slice (Git URLs, Go import paths, workspaces) and stays reserved, so no
  // other slice can take it. Requires admin access to the slice's account.
  rpc RenameSlice(RenameSliceRequest) returns (Slice);
  // SetSliceArchived hides a slice from listings and makes it read-only
  // (archived), or restores it. Its history stays readable and its name stays
  // reserved. Requires admin access to the slice's account.
  rpc SetSliceArchived(SetSliceArchivedRequest) returns (Slice);
  // SetSliceDescription sets or, with "", clears a slice's description.
  // Owners and admins of its account may change it.
  rpc SetSliceDescription(SetSliceDescriptionRequest) returns (Slice);
  // SetSliceMergeOnSubmit turns merging stale changesets on submit on or off
  // (Slice.merge_on_submit). Owners and admins of its account may change it.
  rpc SetSliceMergeOnSubmit(SetSliceMergeOnSubmitRequest) returns (Slice);
  // CreateTag names a native commit for this slice, for releases. Tags are
  // immutable: creating an existing name again succeeds only for the same
  // commit. Requires write access. The Git projection publishes each tag as
  // refs/tags/<name>.
  rpc CreateTag(CreateTagRequest) returns (Tag);
  // ListTags lists a slice's tags, newest first. Readable like the slice.
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  // Slice members (design/26_slice_members.md): people and agents given a
  // role on one slice without joining its account. Anyone with a role on the
  // slice (in the account or on the slice) lists them; the slice's admins add,
  // change and remove them; members remove themselves.
  rpc ListSliceMembers(ListSliceMembersRequest) returns (ListSliceMembersResponse);
  rpc SetSliceMember(SetSliceMemberRequest) returns (SliceMember);
  rpc RemoveSliceMember(RemoveSliceMemberRequest) returns (Empty);
  // ListSharedSlices lists the slices shared with the caller, in other
  // accounts or their own.
  rpc ListSharedSlices(ListSharedSlicesRequest) returns (ListSharedSlicesResponse);
}

message Tag {
  SliceRef slice = 1;
  string name = 2;
  // Native commit on refs/global/main.
  string commit_id = 3;
  // The slice definition version the tag was created under.
  int64 definition_version = 4;
  string message = 5;
  // Username of the creator, or their subject id when they have none.
  string created_by = 6;
  string created_at = 7;
}

message CreateTagRequest {
  SliceRef slice = 1;
  // Git ref syntax, for example v1.2.0 or release/2026-10.
  string name = 2;
  // Defaults to the current head of refs/global/main.
  string commit_id = 3;
  string message = 4;
}

message ListTagsRequest {
  SliceRef slice = 1;
}

message ListTagsResponse {
  repeated Tag tags = 1;
}

message Slice {
  string id = 1;
  SliceRef ref = 2;
  SliceDefinition definition = 3;
  string definition_hash = 4;
  string ci_daemon_id = 5;
  // Archived slices are read-only and left out of listings unless asked for.
  bool archived = 6;
  // Names the slice had before it was renamed. They still resolve to it.
  repeated string former_names = 7;
  // ci_daemon_name is the name the CI daemon is shown by (its display name,
  // else the name it registered with); "" when there is none.
  string ci_daemon_name = 8;
  // description is a short note shown on the slice's page, such as what it
  // holds or which project it mirrors; "" when there is none.
  string description = 9;
  // merge_on_submit: a changeset whose base went stale is merged onto the
  // latest base by the server when it is submitted (a new patchset, which
  // reruns CI), instead of being refused (design/07 section 7.4).
  bool merge_on_submit = 10;
}

message SliceDefinition {
  string slice_id = 1;
  int64 version = 2;
  repeated string included_paths = 3;
  string visibility = 4;
  int32 required_approvals = 5;
  repeated string required_checks = 6;
}

message SliceDefinitionVersion {
  string slice_id = 1;
  int64 version = 2;
  string definition_hash = 3;
  string visibility = 4;
  repeated string included_paths = 5;
  int32 required_approvals = 6;
  repeated string required_checks = 7;
  string created_at = 8;
  string created_by = 9;
}

message CreateSliceRequest {
  SliceRef ref = 1;
  repeated string included_paths = 2;
  string visibility = 3;
  int32 required_approvals = 4;
  repeated string required_checks = 5;
  string description = 6;
}

message ResolveSliceRequest {
  SliceRef ref = 1;
}

message GetSliceRequest {
  string slice_id = 1;
}

message ListSlicesRequest {
  string account = 1;
  string cursor = 2;
  int32 page_size = 3;
  // Include archived slices, which are left out otherwise.
  bool include_archived = 4;
}

message ListSlicesResponse {
  repeated Slice slices = 1;
  string next_cursor = 2;
  // What the account is: personal or organization. Public, like its public
  // slices, so an account page can say so to anyone.
  string account_kind = 3;
}

message ListSliceDefinitionVersionsRequest {
  string slice_id = 1;
  int32 page_size = 2;
}

message ListSliceDefinitionVersionsResponse {
  repeated SliceDefinitionVersion versions = 1;
}

message UpdateSliceDefinitionRequest {
  string slice_id = 1;
  string expected_definition_hash = 2;
  SliceDefinition definition = 3;
}

message SetSliceCIDaemonRequest {
  SliceRef slice = 1;
  string daemon_id = 2;
}

message SetSliceSecretRequest {
  SliceRef slice = 1;
  string name = 2;
  string value = 3;
}

message DeleteSliceSecretRequest {
  SliceRef slice = 1;
  string name = 2;
}

message ListSliceSecretsRequest {
  SliceRef slice = 1;
}

message ListSliceSecretsResponse {
  repeated string names = 1;
  // Where each one comes from; filled only for the account's owners and
  // admins.
  repeated SliceSecret secrets = 2;
}

// SliceSecret is a secret that applies somewhere in a slice.
message SliceSecret {
  string name = 1;
  string secret_id = 2;
  // Deprecated: no longer filled.
  bool all_slices = 3;
  // Deprecated: no longer filled.
  repeated SliceRef shared_with = 4;
  // The folders it applies to (design/33_secrets.md).
  repeated string paths = 5;
}

message DeleteSliceRequest {
  string slice_id = 1;
}

message DeleteSliceResponse {
  string slice_id = 1;
  // True when the slice had changesets: they remain, so the slice's history
  // stays readable on the paths it covered.
  bool history_kept = 2;
}

message RenameSliceRequest {
  SliceRef slice = 1;
  string new_name = 2;
}

message SetSliceArchivedRequest {
  SliceRef slice = 1;
  bool archived = 2;
}

message SetSliceMergeOnSubmitRequest {
  SliceRef slice = 1;
  bool enabled = 2;
}

message SetSliceDescriptionRequest {
  SliceRef slice = 1;
  string description = 2;
}

message SliceMember {
  // The member's username (own account); empty if they have none.
  string username = 1;
  string subject_id = 2;
  // admin, writer or reader.
  string role = 3;
  // The display name on the member's account profile, when set.
  string display_name = 4;
  // person or agent.
  string kind = 5;
  // Username of whoever gave the role.
  string added_by = 6;
  // RFC 3339.
  string created_at = 7;
}

message ListSliceMembersRequest {
  SliceRef slice = 1;
}

message ListSliceMembersResponse {
  SliceRef slice = 1;
  repeated SliceMember members = 2;
}

message SetSliceMemberRequest {
  SliceRef slice = 1;
  // The username to give the role to.
  string username = 2;
  // admin, writer or reader.
  string role = 3;
}

message RemoveSliceMemberRequest {
  SliceRef slice = 1;
  // The member to remove; empty means the caller (leaving the slice).
  string username = 2;
}

message ListSharedSlicesRequest {}

message SharedSlice {
  Slice slice = 1;
  // The caller's role on it: admin, writer or reader.
  string role = 2;
}

message ListSharedSlicesResponse {
  repeated SharedSlice slices = 1;
}
