syntax = "proto3";

package gitslice.core.v1;

import "proto/core/v1/common.proto";

option go_package = "github.com/gitslice-io/gitslice/proto/core/v1;corev1";

service ChangesetService {
  rpc CreateChangeset(CreateChangesetRequest) returns (Changeset);
  rpc GetChangeset(GetChangesetRequest) returns (Changeset);
  rpc ListChangesets(ListChangesetsRequest) returns (ListChangesetsResponse);
  rpc DiffChangeset(DiffChangesetRequest) returns (DiffChangesetResponse);
  rpc UpdateChangeset(UpdateChangesetRequest) returns (Patchset);
  rpc ApproveChangeset(ApproveChangesetRequest) returns (ApproveChangesetResponse);
  rpc ReportCheckResult(ReportCheckResultRequest) returns (ReportCheckResultResponse);
  rpc SubmitChangeset(SubmitChangesetRequest) returns (SubmitChangesetResponse);
  rpc AbandonChangeset(AbandonChangesetRequest) returns (Empty);
}

service ChangesetStackService {
  rpc CreateStack(CreateStackRequest) returns (ChangesetStack);
  rpc GetStack(GetStackRequest) returns (ChangesetStack);
  rpc ListStacks(ListStacksRequest) returns (ListStacksResponse);
  rpc AddStackEntry(AddStackEntryRequest) returns (Changeset);
  rpc MoveStackEntry(MoveStackEntryRequest) returns (ChangesetStack);
  rpc ReparentStackEntry(ReparentStackEntryRequest) returns (ChangesetStack);
  rpc DetachStackEntry(DetachStackEntryRequest) returns (DetachStackEntryResponse);
  rpc Restack(RestackRequest) returns (RestackResponse);
  rpc SubmitStack(SubmitStackRequest) returns (SubmitStackResponse);
}

message Changeset {
  string id = 1;
  SliceRef authoring_slice = 2;
  string author = 3;
  string target_ref = 4;
  string base_commit_id = 5;
  string title = 6;
  string description = 7;
  repeated Patchset patchsets = 8;
  string current_patchset_id = 9;
  int64 current_patchset_number = 10;
  string status = 11;
  repeated string affected_paths = 12;
  SubmitRequirements submit_requirements = 13;
  string commit_id = 14;
  string pending_publish_id = 15;
  int64 number = 16;
  string handle = 17;
  string submit_blocked_reason = 18;
  string stack_id = 19;
  int64 stack_order = 20;
  string parent_changeset_id = 21;
  string parent_patchset_id = 22;
  string base_kind = 23;
  int64 stack_depth = 24;
  int64 sibling_order = 25;
}

message Patchset {
  string id = 1;
  string changeset_id = 2;
  int64 number = 3;
  string base_commit_id = 4;
  string author = 5;
  string created_at = 6;
  repeated string changed_paths = 7;
  repeated FileEdit file_edits = 8;
  repeated PathCoverage coverage = 9;
  SubmitRequirements submit_requirements = 10;
  repeated PathBase path_bases = 11;
  repeated PathSetEntry read_set = 12;
  repeated PathSetEntry write_set = 13;
  string handle = 14;
  repeated PatchsetConflict conflicts = 15;
  string kind = 16;
  string base_kind = 17;
  string base_patchset_id = 18;
  string base_tree_id = 19;
  string result_tree_id = 20;
  string stack_parent_patchset_id = 21;
}

message ChangesetStack {
  string id = 1;
  SliceRef authoring_slice = 2;
  string target_ref = 3;
  string base_commit_id = 4;
  string title = 5;
  string status = 6;
  string active_entry_id = 7;
  string root_entry_id = 8;
  repeated ChangesetStackEntry entries = 9;
  string created_by = 10;
  string created_at = 11;
  string updated_at = 12;
}

message ChangesetStackEntry {
  string stack_id = 1;
  string changeset_id = 2;
  string parent_changeset_id = 3;
  string parent_patchset_id = 4;
  int64 sibling_order = 5;
  int64 display_order = 6;
  int64 depth = 7;
  string state = 8;
  Changeset changeset = 9;
}

message FileEdit {
  string op = 1;
  string path = 2;
  string old_path = 3;
  string blob_id = 4;
  string content_hash = 5;
  uint32 mode = 6;
}

message PathCoverage {
  string path = 1;
  repeated string covering_slice_ids = 2;
}

message PathBase {
  string path = 1;
  string base_commit_id = 2;
  bool exists = 3;
  string entry_kind = 4;
  uint32 mode = 5;
  string blob_id = 6;
  string content_hash = 7;
  string tree_id = 8;
  string symlink_target = 9;
  string entry_fingerprint = 10;
  string check = 11;
}

message PatchsetConflict {
  string path = 1;
  string conflict_class = 2;
  string old_base_commit_id = 3;
  string new_base_commit_id = 4;
  string base_fingerprint = 5;
  string local_fingerprint = 6;
  string remote_fingerprint = 7;
  string base_content_hash = 8;
  string local_content_hash = 9;
  string remote_content_hash = 10;
}

message PathSetEntry {
  string path = 1;
  bool recursive = 2;
}

message SubmitRequirements {
  int32 required_approvals = 1;
  repeated string required_checks = 2;
  repeated string path_lock_ids = 3;
  string source_slice_definition_hash = 4;
  string source_path_lock_set_hash = 5;
}

message CreateChangesetRequest {
  SliceRef authoring_slice = 1;
  // Reserved for future branch support. Currently optional; when provided it
  // must be the single global ref, refs/global/main.
  string target_ref = 2;
  string base_commit_id = 3;
  string title = 4;
  string description = 5;
  string stack_id = 6;
  string parent_changeset_id = 7;
  string parent_patchset_id = 8;
}

message GetChangesetRequest {
  string changeset_id = 1;
}

message ListChangesetsRequest {
  SliceRef authoring_slice = 1;
  string status = 2;
  int32 limit = 3;
}

message ListChangesetsResponse {
  repeated Changeset changesets = 1;
}

message DiffChangesetRequest {
  string changeset_id = 1;
  // patchset, from_patchset, and to_patchset accept a patchset number encoded as
  // a string, an exact patchset handle, or a canonical patchset id.
  string patchset = 2;
  string from_patchset = 3;
  string to_patchset = 4;
}

message DiffChangesetResponse {
  string changeset_id = 1;
  string from_patchset_id = 2;
  string to_patchset_id = 3;
  repeated string changed_paths = 4;
  string diff = 5;
  string changeset_handle = 6;
  string from_patchset_handle = 7;
  string to_patchset_handle = 8;
}

message UpdateChangesetRequest {
  string changeset_id = 1;
  string expected_current_patchset_id = 2;
  string base_commit_id = 3;
  repeated FileEdit file_edits = 4;
  repeated PatchsetConflict conflicts = 5;
  string patchset_kind = 6;
  string base_kind = 7;
  string base_patchset_id = 8;
  string expected_parent_patchset_id = 9;
}

message SubmitChangesetRequest {
  string changeset_id = 1;
  string expected_current_patchset_id = 2;
}

message ApproveChangesetRequest {
  string changeset_id = 1;
}

message ApproveChangesetResponse {
  string changeset_id = 1;
  string patchset_id = 2;
  string subject_id = 3;
}

message ReportCheckResultRequest {
  string changeset_id = 1;
  string check_name = 2;
  string status = 3;
}

message ReportCheckResultResponse {
  string changeset_id = 1;
  string patchset_id = 2;
  string check_name = 3;
  string status = 4;
}

message SubmitChangesetResponse {
  string commit_id = 1;
  string target_ref = 2;
  string new_ref_commit_id = 3;
  string status = 4;
  string pending_publish_id = 5;
  string changeset_handle = 6;
}

message AbandonChangesetRequest {
  string changeset_id = 1;
  string reason = 2;
}

message CreateStackRequest {
  SliceRef authoring_slice = 1;
  string target_ref = 2;
  string base_commit_id = 3;
  string title = 4;
}

message GetStackRequest {
  string stack_id = 1;
}

message ListStacksRequest {
  SliceRef authoring_slice = 1;
  string status = 2;
  int32 limit = 3;
}

message ListStacksResponse {
  repeated ChangesetStack stacks = 1;
}

message AddStackEntryRequest {
  string stack_id = 1;
  string title = 2;
  string description = 3;
  string parent_changeset_id = 4;
  string parent_patchset_id = 5;
  int64 sibling_order = 6;
}

message MoveStackEntryRequest {
  string stack_id = 1;
  string changeset_id = 2;
  int64 sibling_order = 3;
}

message ReparentStackEntryRequest {
  string stack_id = 1;
  string changeset_id = 2;
  string new_parent_changeset_id = 3;
  string new_parent_patchset_id = 4;
  int64 sibling_order = 5;
}

message DetachStackEntryRequest {
  string stack_id = 1;
  string changeset_id = 2;
  string title = 3;
}

message DetachStackEntryResponse {
  ChangesetStack source_stack = 1;
  ChangesetStack detached_stack = 2;
}

message RestackRequest {
  string stack_id = 1;
  string start_changeset_id = 2;
  bool include_siblings = 3;
  string target_base_commit_id = 4;
}

message RestackResponse {
  string stack_id = 1;
  repeated Changeset entries = 2;
  string status = 3;
}

message SubmitStackRequest {
  string stack_id = 1;
  string subtree_root_changeset_id = 2;
}

message SubmitStackEntryResult {
  string changeset_id = 1;
  string status = 2;
  string commit_id = 3;
  string pending_publish_id = 4;
  string blocked_reason = 5;
}

message SubmitStackResponse {
  string stack_id = 1;
  string status = 2;
  repeated SubmitStackEntryResult results = 3;
}
