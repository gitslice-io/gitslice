syntax = "proto3";

package gitslice.core.v1;

option go_package = "github.com/gitslice-io/gitslice/proto/core/v1;corev1";

service BlobService {
  rpc GetBlobStatus(GetBlobStatusRequest) returns (GetBlobStatusResponse);
  rpc UploadBlob(UploadBlobRequest) returns (UploadBlobResponse);
}

message GetBlobStatusRequest {
  repeated string content_hashes = 1;
}

message BlobRecord {
  string id = 1;
  string content_hash = 2;
  int64 size = 3;
  string storage_location = 4;
  string state = 5;
}

message GetBlobStatusResponse {
  repeated BlobRecord blobs = 1;
}

message UploadBlobRequest {
  string content_hash = 1;
  bytes data = 2;
}

message UploadBlobResponse {
  string blob_id = 1;
  string content_hash = 2;
  int64 size = 3;
}
