syntax = "proto3";

package gitslice.core.v1;

import "proto/core/v1/common.proto";

option go_package = "github.com/gitslice-io/gitslice/proto/core/v1;corev1";

service BlobService {
  rpc GetBlobStatus(GetBlobStatusRequest) returns (GetBlobStatusResponse);
  rpc UploadBlob(UploadBlobRequest) returns (UploadBlobResponse);
  rpc UploadBlobStream(stream UploadBlobChunk) returns (UploadBlobResponse);
  rpc ReadBlobStream(ReadBlobStreamRequest) returns (stream ReadBlobChunk);
}

message GetBlobStatusRequest {
  repeated string content_hashes = 1;
  SliceRef slice = 2;
}

message BlobRecord {
  string id = 1;
  string content_hash = 2;
  int64 size = 3;
  string storage_location = 4;
  string state = 5;
}

message GetBlobStatusResponse {
  repeated BlobRecord blobs = 1;
}

message UploadBlobRequest {
  string content_hash = 1;
  bytes data = 2;
  SliceRef slice = 3;
}

message UploadBlobInit {
  SliceRef slice = 1;
  string content_hash = 2;
  optional int64 size = 3;
}

message UploadBlobChunk {
  oneof payload {
    UploadBlobInit init = 1;
    bytes data = 2;
  }
}

message UploadBlobResponse {
  string blob_id = 1;
  string content_hash = 2;
  int64 size = 3;
}

message ReadBlobStreamRequest {
  SliceRef slice = 1;
  string content_hash = 2;
  int64 offset = 3;
  int64 length = 4;
}

message ReadBlobChunk {
  bytes data = 1;
  int64 offset = 2;
  string content_hash = 3;
}
