# Cloud Build pipeline for the gitslice core server.
#
# Steps: build the image (via Dockerfile) -> push -> run DB migrations as a
# one-shot Cloud Run Job (-migrate-only) -> deploy/update the Cloud Run service.
#
# This is the declarative replacement for deploy/cloudrun.sh's gcloud glue; the
# Dockerfile is still used to build the image (swap the `build` step for a
# buildpacks/ko step if you ever want to drop the Dockerfile).
#
# Run manually:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_R2_ENDPOINT=https://<acct>.r2.cloudflarestorage.com,_R2_BUCKET=gitslice-prod,_CLERK_PUBLISHABLE_KEY=pk_live_...,_TAG=$(git rev-parse --short HEAD) .
#
# Or attach a Cloud Build trigger on push to main (the trigger supplies $SHORT_SHA;
# pass _TAG=$SHORT_SHA in the trigger substitutions).
#
# IAM: the Cloud Build service account needs roles/run.admin (deploy service +
# job) and roles/iam.serviceAccountUser on the Cloud Run runtime service account.
# The runtime service account needs roles/secretmanager.secretAccessor for the
# secrets referenced below.

substitutions:
  _REGION: us-central1
  _REPO: gitslice                 # Artifact Registry repo
  _SERVICE: gitslice-server
  _JOB: gitslice-migrate
  _TAG: latest                    # image tag; pass $SHORT_SHA from a trigger
  _ALLOWED_ORIGIN: https://agenttools.dev
  _R2_ENDPOINT: ""                # required: https://<acct>.r2.cloudflarestorage.com
  _R2_BUCKET: ""                  # required
  _R2_PREFIX: prod
  _R2_REGION: auto
  _CLERK_PUBLISHABLE_KEY: ""      # required (publishable, non-secret)
  _MIN_INSTANCES: "1"             # background workers need a warm instance
  _MAX_INSTANCES: "3"             # 32*N DB conns must stay under Neon's limit
  _PUBLISH_INTERVAL_MS: "30000"   # long fallback; nudges drain real activity now
  _INDEX_INTERVAL_MS: "30000"

steps:
  # Shared env/secret strings written to the /workspace volume so the migrate and
  # deploy steps don't duplicate them. Substitutions are expanded by Cloud Build
  # before the shell runs.
  - id: config
    name: bash
    args:
      - -c
      - |
        cat > /workspace/deployenv.sh <<'EOF'
        export IMG="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}"
        export ENVS="GITSLICE_GRPC_ADDR=0.0.0.0:8080,OBJECT_STORE_TYPE=r2,R2_ENDPOINT=${_R2_ENDPOINT},R2_REGION=${_R2_REGION},R2_BUCKET=${_R2_BUCKET},R2_PREFIX=${_R2_PREFIX},R2_USE_PATH_STYLE=false,AUTH_PROVIDER=clerk,CLERK_PUBLISHABLE_KEY=${_CLERK_PUBLISHABLE_KEY},GITSLICE_HTTP_ALLOWED_ORIGIN=${_ALLOWED_ORIGIN},GITSLICE_OBJECT_STORE_ROOT=/tmp/gitslice-objects,GITSLICE_PUBLISH_INTERVAL_MS=${_PUBLISH_INTERVAL_MS},GITSLICE_INDEX_INTERVAL_MS=${_INDEX_INTERVAL_MS}"
        export SECRETS="GITSLICE_DATABASE_URL=gitslice-database-url:latest,R2_ACCESS_KEY_ID=gitslice-r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=gitslice-r2-secret-access-key:latest,CLERK_SECRET_KEY=gitslice-clerk-secret-key:latest,CLERK_WEBHOOK_SECRET=gitslice-clerk-webhook-secret:latest"
        EOF

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # Push explicitly here: the top-level `images:` field only pushes AFTER all
  # steps, but the migrate/deploy steps below need to pull the image mid-build.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # Run migrations once and wait. Uses -migrate-only (DDL + EnsureEmptyRoot +
  # bootstrap seed, then exit 0). The serving step sets GITSLICE_RUN_MIGRATIONS=0.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/deployenv.sh
        # $$ escapes shell vars so Cloud Build does not treat them as build
        # substitutions; ${_FOO} are Cloud Build substitutions (single $).
        gcloud run jobs deploy ${_JOB} --region ${_REGION} --image "$$IMG" \
          --args="-migrate-only" \
          --set-env-vars "$$ENVS" --set-secrets "$$SECRETS" \
          --max-retries=1 --task-timeout=600
        gcloud run jobs execute ${_JOB} --region ${_REGION} --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/deployenv.sh
        gcloud run deploy ${_SERVICE} --region ${_REGION} --image "$$IMG" \
          --port=8080 \
          --use-http2 \
          --no-cpu-throttling \
          --min-instances=${_MIN_INSTANCES} --max-instances=${_MAX_INSTANCES} \
          --cpu=1 --memory=1Gi --concurrency=80 --timeout=3600 \
          --allow-unauthenticated \
          --set-env-vars "$$ENVS,GITSLICE_RUN_MIGRATIONS=0" \
          --set-secrets "$$SECRETS"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

timeout: 1800s
options:
  # The Go build is CPU-bound (~4-5 min on the default machine); a bigger machine
  # speeds it up. Drop this to use the default pool.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
