events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/gitslice.access.log main;
    error_log /var/log/nginx/gitslice.error.log;

    # Trust Cloudflare edge proxy ranges so $remote_addr reflects the real
    # client IP from CF-Connecting-IP (and cannot be spoofed directly).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    upstream production_core_service {
        server 127.0.0.1:50051;
    }

    upstream staging_core_service {
        server 127.0.0.1:50052;
    }

    # Rewrite (slices) JSON gateway for /v1/ REST on the staging host.
    upstream staging_http_gateway {
        server 127.0.0.1:8081;
    }

    # Do not enable cleartext HTTP/2 (h2c) on port 80. Cloudflare gRPC expects
    # an HTTPS origin with HTTP/2 on 443, so port 80 should only redirect.
    #
    # Cloudflare Origin CA cert/key paths (provided by operator):
    #   - /home/nic/cert/gitslice.io.pem
    #   - /home/nic/cert/gitslice.io.pri
    #   - /home/nic/cert/agenttools.dev.pem
    #   - /home/nic/cert/agenttools.dev.pri
    server {
        listen 80;
        server_name api.gitslice.io api.agenttools.dev;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.gitslice.io;

        ssl_certificate /home/nic/cert/gitslice.io.pem;
        ssl_certificate_key /home/nic/cert/gitslice.io.pri;
        grpc_read_timeout 30m;
        grpc_send_timeout 30m;

        # Production gRPC/Connect services under gitslice.core.v1 + gRPC health.
        location /gitslice.core.v1. {
            grpc_pass grpc://production_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /grpc.health.v1. {
            grpc_pass grpc://production_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /slice.v1.SliceService/ {
            grpc_pass grpc://production_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /admin.v1.AdminService/ {
            grpc_pass grpc://production_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /account.v1.AccountService/ {
            grpc_pass grpc://production_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /file.v1.FileService/ {
            grpc_pass grpc://production_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /filesystem.v1.FilesystemService/ {
            grpc_pass grpc://production_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /agent.v1.AgentService/ {
            grpc_pass grpc://production_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /ci.v1.CIService/ {
            grpc_pass grpc://production_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /ci.v1.RunnerAdminService/ {
            grpc_pass grpc://production_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /ci.v1.RunnerService/ {
            grpc_pass grpc://production_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location ^~ /v1/ {
            proxy_pass http://production_core_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /git/ {
            client_max_body_size 128m;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_pass http://production_core_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl http2;
        server_name api.agenttools.dev;

        ssl_certificate /home/nic/cert/agenttools.dev.pem;
        ssl_certificate_key /home/nic/cert/agenttools.dev.pri;
        grpc_read_timeout 30m;
        grpc_send_timeout 30m;

        # Rewrite (slices) gRPC API: all services live under the
        # gitslice.core.v1 package, plus the gRPC health service.
        location /gitslice.core.v1. {
            grpc_pass grpc://staging_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /grpc.health.v1. {
            grpc_pass grpc://staging_core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location ^~ /v1/ {
            proxy_pass http://staging_http_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Git smart-HTTP is not enabled in this rewrite deployment
        # (GITSLICE_GIT_HTTP_ADDR unset); route to the gateway so requests
        # return a clean 404 rather than hitting the gRPC port.
        location ^~ /git/ {
            client_max_body_size 128m;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_pass http://staging_http_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }
}
