# Cloud Build webhook trigger gs-ops-webhook, generated from cloudbuild.yaml
# (python3 ops/automation/gentrigger.py . after changing it). Import with:
#   gcloud builds triggers import --source=ops/automation/trigger.yaml \
#     --project unified-surfer-486904-i6 --region=global
name: gs-ops-webhook
description: Deployment operations started by the manual automations in .gitslice/automations.yaml (ops/automation)
serviceAccount: projects/unified-surfer-486904-i6/serviceAccounts/147550290058-compute@developer.gserviceaccount.com
webhookConfig:
  secret: projects/unified-surfer-486904-i6/secrets/gs-ops-webhook-secret/versions/1
substitutions:
  _EVENT: $(body.event)
  _PAYLOAD: $(body)
filter: _EVENT == "manual"
build:
  steps:
  - id: payload
    name: python:3.12-slim
    entrypoint: python3
    env:
    - PAYLOAD=${_PAYLOAD}
    args:
    - -c
    - "import json, os, shlex\npayload = json.loads(os.environ[\"PAYLOAD\"])\ndef field(path):\n    v = payload\n    for k in path.split(\".\"):\n        v = v.get(k) if isinstance(v, dict) else None\n\
      \    return v if isinstance(v, str) else \"\"\nwith open(\"/workspace/op.env\", \"w\") as f:\n    for name, path in [(\"OP\", \"automation.id\"), (\"SENDER\", \"sender.username\"), (\"REVISION\",\
      \ \"inputs.revision\"), (\"TAG\", \"tag.name\"), (\"CALLBACK\", \"callback\")]:\n        f.write(f\"{name}={shlex.quote(field(path))}\\n\")\n"
  - id: op
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    env:
    - PROJECT=$PROJECT_ID
    - SERVICE=gitslice-prod
    - REGION=us-west1
    - DEPLOY_TRIGGER=rmgpgab-gitslice-prod-us-west1-gitslice-io-gitslice--maovz
    - BUILD=$BUILD_ID
    args:
    - -c
    - "set -euo pipefail\n. /workspace/op.env\n# A run started by the worker (.gitslice/ops/runbook.js) passes its\n# callback URL: progress lines and the result go back to the run, so\n# `gs auto run --follow`\
      \ shows them. Never echo the URL.\njson() { printf '\"%s\"' \"$$(printf '%s' \"$$1\" | sed 's/\\\\/\\\\\\\\/g; s/\"/\\\\\"/g')\"; }\npost() {\n  [ -n \"$${CALLBACK:-}\" ] || return 0\n  curl -fsS\
      \ -m 20 --retry 3 --retry-all-errors -o /dev/null -H 'Content-Type: application/json' \\\n    --data \"$$1\" \"$$CALLBACK\" || echo \"warning: could not report to the automation run\" >&2\n}\nsay()\
      \ { echo \"$$1\"; printf \"%s\\n\" \"$$1\" >> /workspace/said.log; post \"{\\\"lines\\\":[$$(json \"$$1\")]}\"; }\n# Everything the operation prints also goes to op.log; a failure\n# reports its last\
      \ lines (gcloud's error), not just \"failed\".\ntouch /workspace/said.log\nexec > >(tee -a /workspace/op.log) 2>&1\nfinish() {\n  rc=$$?\n  lines=\"\"\n  if [ \"$$rc\" = 0 ]; then\n    outcome=succeeded\n\
      \  else\n    outcome=failed\n    sleep 1\n    while IFS= read -r l; do lines=\"$$lines$$(json \"$$l\"),\"; done < <(grep -v '^ *$$' /workspace/op.log | grep -vxF -f /workspace/said.log | tail -n 15)\n\
      \  fi\n  post \"{\\\"outcome\\\":\\\"$$outcome\\\",\\\"lines\\\":[$$lines$$(json \"Cloud Build $$BUILD: $$outcome\")]}\"\n}\ntrap finish EXIT\necho \"operation $$OP, run by $${SENDER:-unknown}\"\n\
      printf '%s\\n' \"operation $$OP, run by $${SENDER:-unknown}\" >> /workspace/said.log\npost \"{\\\"lines\\\":[$$(json \"operation $$OP, run by $${SENDER:-unknown}\")],\\\"details_url\\\":$$(json \"\
      https://console.cloud.google.com/cloud-build/builds/$$BUILD?project=$$PROJECT\")}\"\nservice_url() {\n  gcloud run services describe \"$$SERVICE\" --region \"$$REGION\" --project \"$$PROJECT\" --format='value(status.url)'\n\
      }\nready() {\n  curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors \"$$(service_url)/readyz\"\n}\n# release_build [substitutions] runs the release pipeline\n# (ops/release/cloudbuild.yaml,\
      \ read from main) as its own build,\n# waits for it, and reports what it published. Its output is in\n# that build's log; a failure reports the log's last lines.\nrelease_build() {\n  git clone -q\
      \ --depth 1 -- https://gitslice.io/git/gitslice/gitslice.git /workspace/src\n  id=\"$$(gcloud builds submit --no-source --async --region=global --project \"$$PROJECT\" \\\n    --config /workspace/src/gitslice/gitslice/ops/release/cloudbuild.yaml\
      \ \"$$@\" --format='value(id)')\"\n  say \"release build $$id: https://console.cloud.google.com/cloud-build/builds/$$id?project=$$PROJECT\"\n  while :; do\n    status=\"$$(gcloud builds describe \"\
      $$id\" --region=global --project \"$$PROJECT\" --format='value(status)')\"\n    case \"$$status\" in\n      SUCCESS|FAILURE|CANCELLED|TIMEOUT|INTERNAL_ERROR|EXPIRED) break ;;\n    esac\n    sleep\
      \ 15\n  done\n  log=\"$$(gcloud builds log \"$$id\" --region=global --project \"$$PROJECT\" 2>/dev/null || true)\"\n  if [ \"$$status\" != SUCCESS ]; then\n    printf '%s\\n' \"$$log\" | grep '^Step\
      \ #' | tail -n 15\n    echo \"release build $$id ended $$status\" >&2\n    exit 1\n  fi\n  printf '%s\\n' \"$$log\" | sed -n 's/^Step #[0-9]* - \"[a-z]*\": //p' | grep -E '^(published|nothing to|no\
      \ tags to build|latest: )' |\n    while IFS= read -r l; do say \"$$l\"; done\n}\ncase \"$$OP\" in\n  gitslice/deploy-server)\n    # Builds main of the GitHub mirror, like the daily deploy.\n    id=\"\
      $$(gcloud builds triggers run \"$$DEPLOY_TRIGGER\" --branch=main --region=global \\\n      --project \"$$PROJECT\" --format='value(metadata.build.id)')\"\n    say \"deploy build $$id: https://console.cloud.google.com/cloud-build/builds/$$id?project=$$PROJECT\"\
      \n    while :; do\n      status=\"$$(gcloud builds describe \"$$id\" --region=global --project \"$$PROJECT\" --format='value(status)')\"\n      case \"$$status\" in\n        SUCCESS) break ;;\n  \
      \      FAILURE|CANCELLED|TIMEOUT|INTERNAL_ERROR|EXPIRED) echo \"deploy build $$id ended $$status\" >&2; exit 1 ;;\n      esac\n      sleep 20\n    done\n    # A rollback pins traffic to one revision;\
      \ a deploy sends it back\n    # to the newest.\n    gcloud run services update-traffic \"$$SERVICE\" --region \"$$REGION\" --project \"$$PROJECT\" --to-latest --quiet\n    ready\n    say \"deployed\
      \ $$(gcloud run services describe \"$$SERVICE\" --region \"$$REGION\" --project \"$$PROJECT\" \\\n      --format='value(status.latestReadyRevisionName)'); /readyz answers\"\n    ;;\n  gitslice/rollback-server)\n\
      \    if [[ ! \"$$REVISION\" =~ ^gitslice-prod-[0-9]{5}-[a-z0-9]{3}$ ]]; then\n      say \"revision must look like gitslice-prod-00147-xpj, got '$$REVISION'\" >&2; exit 1\n    fi\n    gcloud run revisions\
      \ describe \"$$REVISION\" --region \"$$REGION\" --project \"$$PROJECT\" --format='value(name)' >/dev/null\n    gcloud run services update-traffic \"$$SERVICE\" --region \"$$REGION\" --project \"$$PROJECT\"\
      \ \\\n      --to-revisions=\"$$REVISION=100\" --quiet\n    ready\n    say \"all traffic on $$REVISION; /readyz answers. The next deploy-server moves it to the newest revision.\"\n    ;;\n  gitslice/release)\n\
      \    # tag.created: builds and publishes that tag (not again when it\n    # is published already).\n    if [[ ! \"$$TAG\" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$$ ]]; then\n      say \"not\
      \ a release tag: '$$TAG'\" >&2; exit 1\n    fi\n    say \"releasing $$TAG\"\n    release_build \"--substitutions=_TAG=$$TAG\"\n    curl -fsS -o /dev/null \"https://gitslice.io/releases/download/$$TAG/checksums.txt\"\
      \n    say \"https://gitslice.io/releases/download/$$TAG/ serves $$TAG\"\n    ;;\n  gitslice/publish-releases)\n    # The daily reconcile, now: builds every vX.Y.Z tag not yet in R2.\n    release_build\n\
      \    ;;\n  gitslice/ops-selftest)\n    say \"ok\"\n    ;;\n  *)\n    say \"not an operation: '$$OP'\" >&2; exit 1\n    ;;\nesac\n"
  timeout: 2400s
  options:
    logging: CLOUD_LOGGING_ONLY
