# Cloud Build config of the webhook trigger gs-ops-webhook (project
# unified-surfer-486904-i6). The manual automations in .gitslice/automations.yaml
# run the worker .gitslice/ops/runbook.js, which posts the run to the
# trigger's URL (its key and secret are the Gitslice secret OPS_WEBHOOK_QUERY)
# with a callback URL for the build's report, so an agent can deploy without Google Cloud credentials or any other secret: the
# automation's manual policy decides who may run it, and this build holds the
# credentials (the Compute default service account).
#
# The trigger (trigger.yaml) passes the run's whole payload as _PAYLOAD
# ($(body)) and only starts a build when _EVENT ($(body.event)) is "manual".
# Fields are read from the payload here, not mapped one by one: Cloud Build
# fails a build whose mapping names a field the body lacks, and a run of an
# automation without inputs has no "inputs" at all. The payload reaches the
# script only through env, never as shell text, and each operation checks
# its own inputs.
#
# After changing this file, regenerate trigger.yaml and import it:
#   gcloud builds triggers import --source=ops/automation/trigger.yaml \
#     --project unified-surfer-486904-i6 --region=global
steps:
  # Reads the fields the operations use into /workspace/op.env, shell-quoted.
  - id: payload
    name: python:3.12-slim
    entrypoint: python3
    env:
      - PAYLOAD=${_PAYLOAD}
    args:
      - -c
      - |
        import json, os, shlex
        payload = json.loads(os.environ["PAYLOAD"])
        def field(path):
            v = payload
            for k in path.split("."):
                v = v.get(k) if isinstance(v, dict) else None
            return v if isinstance(v, str) else ""
        with open("/workspace/op.env", "w") as f:
            for name, path in [("OP", "automation.id"), ("SENDER", "sender.username"), ("REVISION", "inputs.revision"), ("TAG", "tag.name"), ("CALLBACK", "callback")]:
                f.write(f"{name}={shlex.quote(field(path))}\n")

  - id: op
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    env:
      - PROJECT=$PROJECT_ID
      - SERVICE=gitslice-prod
      - REGION=us-west1
      # The production values of the repository's cloudbuild.yaml (all
      # public), which the GitHub-connected trigger used to hold.
      - PROD_SUBS=_DEPLOY_REGION=us-west1,_SERVICE_NAME=gitslice-prod,_AR_HOSTNAME=us-west1-docker.pkg.dev,_AR_REPOSITORY=cloud-run-source-deploy,_ALLOWED_ORIGIN=https://gitslice.io,_R2_ENDPOINT=https://02fa014ee5c259f9cb1e01cf224ae197.r2.cloudflarestorage.com,_R2_BUCKET=gitslice-production,_CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsuZ2l0c2xpY2UuaW8k,_CLERK_ISSUER=https://clerk.gitslice.io,_POSTHOG_API_KEY=phc_yG9FTnswZnzaoA7FtE7etBPxmhx9TbZkscVH86uKiBzC
      - BUILD=$BUILD_ID
    args:
      - -c
      - |
        set -euo pipefail
        . /workspace/op.env
        # A run started by the worker (.gitslice/ops/runbook.js) passes its
        # callback URL: progress lines and the result go back to the run, so
        # `gs auto run --follow` shows them. Never echo the URL.
        json() { printf '"%s"' "$$(printf '%s' "$$1" | sed 's/\\/\\\\/g; s/"/\\"/g')"; }
        post() {
          [ -n "$${CALLBACK:-}" ] || return 0
          curl -fsS -m 20 --retry 3 --retry-all-errors -o /dev/null -H 'Content-Type: application/json' \
            --data "$$1" "$$CALLBACK" || echo "warning: could not report to the automation run" >&2
        }
        say() { echo "$$1"; printf "%s\n" "$$1" >> /workspace/said.log; post "{\"lines\":[$$(json "$$1")]}"; }
        # Everything the operation prints also goes to op.log; a failure
        # reports its last lines (gcloud's error), not just "failed".
        touch /workspace/said.log
        exec > >(tee -a /workspace/op.log) 2>&1
        finish() {
          rc=$$?
          lines=""
          if [ "$$rc" = 0 ]; then
            outcome=succeeded
          else
            outcome=failed
            sleep 1
            while IFS= read -r l; do lines="$$lines$$(json "$$l"),"; done < <(grep -v '^ *$$' /workspace/op.log | grep -vxF -f /workspace/said.log | tail -n 15)
          fi
          post "{\"outcome\":\"$$outcome\",\"lines\":[$$lines$$(json "Cloud Build $$BUILD: $$outcome")]}"
        }
        trap finish EXIT
        echo "operation $$OP, run by $${SENDER:-unknown}"
        printf '%s\n' "operation $$OP, run by $${SENDER:-unknown}" >> /workspace/said.log
        post "{\"lines\":[$$(json "operation $$OP, run by $${SENDER:-unknown}")],\"details_url\":$$(json "https://console.cloud.google.com/cloud-build/builds/$$BUILD?project=$$PROJECT")}"
        service_url() {
          gcloud run services describe "$$SERVICE" --region "$$REGION" --project "$$PROJECT" --format='value(status.url)'
        }
        ready() {
          curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors "$$(service_url)/readyz"
        }
        # release_build [substitutions] runs the release pipeline
        # (ops/release/cloudbuild.yaml, read from main) as its own build,
        # waits for it, and reports what it published. Its output is in
        # that build's log; a failure reports the log's last lines.
        # server_build runs the repository's cloudbuild.yaml (gate, build,
        # migrate, deploy) on main as cloned from Gitslice, as its own
        # build, and waits for it. The image tag is the Gitslice commit; the
        # gate skips the build when that tag is already deployed.
        server_build() {
          git clone -q --depth 1 -- https://gitslice.io/git/gitslice/gitslice.git /workspace/server
          tag="$$(git -C /workspace/server rev-parse --short=12 HEAD)"
          id="$$(gcloud builds submit /workspace/server/gitslice/gitslice --async --region=global --project "$$PROJECT" \
            --config /workspace/server/gitslice/gitslice/cloudbuild.yaml --substitutions="$$PROD_SUBS,_TAG=$$tag" --format='value(id)')"
          say "deploy build $$id of main at $$tag: https://console.cloud.google.com/cloud-build/builds/$$id?project=$$PROJECT"
          while :; do
            status="$$(gcloud builds describe "$$id" --region=global --project "$$PROJECT" --format='value(status)')"
            case "$$status" in
              SUCCESS) break ;;
              FAILURE|CANCELLED|TIMEOUT|INTERNAL_ERROR|EXPIRED)
                gcloud builds log "$$id" --region=global --project "$$PROJECT" 2>/dev/null | grep '^Step #' | tail -n 15
                echo "deploy build $$id ended $$status" >&2; exit 1 ;;
            esac
            sleep 20
          done
        }
        release_build() {
          git clone -q --depth 1 -- https://gitslice.io/git/gitslice/gitslice.git /workspace/src
          id="$$(gcloud builds submit --no-source --async --region=global --project "$$PROJECT" \
            --config /workspace/src/gitslice/gitslice/ops/release/cloudbuild.yaml "$$@" --format='value(id)')"
          say "release build $$id: https://console.cloud.google.com/cloud-build/builds/$$id?project=$$PROJECT"
          while :; do
            status="$$(gcloud builds describe "$$id" --region=global --project "$$PROJECT" --format='value(status)')"
            case "$$status" in
              SUCCESS|FAILURE|CANCELLED|TIMEOUT|INTERNAL_ERROR|EXPIRED) break ;;
            esac
            sleep 15
          done
          log="$$(gcloud builds log "$$id" --region=global --project "$$PROJECT" 2>/dev/null || true)"
          if [ "$$status" != SUCCESS ]; then
            printf '%s\n' "$$log" | grep '^Step #' | tail -n 15
            echo "release build $$id ended $$status" >&2
            exit 1
          fi
          printf '%s\n' "$$log" | sed -n 's/^Step #[0-9]* - "[a-z]*": //p' | grep -E '^(published v|nothing to publish|no tags to build|latest: [{])' |
            while IFS= read -r l; do say "$$l"; done
        }
        case "$$OP" in
          gitslice/deploy-server)
            server_build
            # A rollback pins traffic to one revision; a deploy sends it back
            # to the newest.
            gcloud run services update-traffic "$$SERVICE" --region "$$REGION" --project "$$PROJECT" --to-latest --quiet
            ready
            say "deployed $$(gcloud run services describe "$$SERVICE" --region "$$REGION" --project "$$PROJECT" \
              --format='value(status.latestReadyRevisionName)'); /readyz answers"
            ;;
          gitslice/rollback-server)
            if [[ ! "$$REVISION" =~ ^gitslice-prod-[0-9]{5}-[a-z0-9]{3}$ ]]; then
              say "revision must look like gitslice-prod-00147-xpj, got '$$REVISION'" >&2; exit 1
            fi
            gcloud run revisions describe "$$REVISION" --region "$$REGION" --project "$$PROJECT" --format='value(name)' >/dev/null
            gcloud run services update-traffic "$$SERVICE" --region "$$REGION" --project "$$PROJECT" \
              --to-revisions="$$REVISION=100" --quiet
            ready
            say "all traffic on $$REVISION; /readyz answers. The next deploy-server moves it to the newest revision."
            ;;
          gitslice/release)
            # tag.created: builds and publishes that tag (not again when it
            # is published already).
            if [[ ! "$$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$$ ]]; then
              say "not a release tag: '$$TAG'" >&2; exit 1
            fi
            say "releasing $$TAG"
            release_build "--substitutions=_TAG=$$TAG"
            curl -fsS -o /dev/null "https://gitslice.io/releases/download/$$TAG/checksums.txt"
            say "https://gitslice.io/releases/download/$$TAG/ serves $$TAG"
            ;;
          gitslice/publish-releases)
            # The daily reconcile, now: builds every vX.Y.Z tag not yet in R2.
            release_build
            ;;
          daily-deploy)
            # Cloud Scheduler job gitslice-prod-daily-build posts this once a
            # day (no automation, no callback): deploys main when it moved,
            # and leaves the traffic where it is, so a rollback stays.
            server_build
            ;;
          gitslice/ops-selftest)
            say "ok"
            ;;
          *)
            say "not an operation: '$$OP'" >&2; exit 1
            ;;
        esac
timeout: 2400s
options:
  logging: CLOUD_LOGGING_ONLY
