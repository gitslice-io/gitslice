name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  go:
    name: Go tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files="$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run unit tests
        run: go test ./...

      - name: Build commands
        run: go build ./cmd/...

  web:
    name: Web build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run unit and render-smoke tests
        run: npm test

  postgres:
    name: PostgreSQL e2e tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gitslice
          POSTGRES_PASSWORD: gitslice
          POSTGRES_DB: gitslice_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitslice -d gitslice_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GITSLICE_TEST_DATABASE_URL: postgres://gitslice:gitslice@localhost:5432/gitslice_dev?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run PostgreSQL storage tests
        run: go test -count=1 ./internal/postgres -v

      - name: Run CLI and RPC e2e tests
        run: go test -count=1 ./tests/cli ./tests/rpc -v

  load:
    name: Load tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gitslice
          POSTGRES_PASSWORD: gitslice
          POSTGRES_DB: gitslice_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitslice -d gitslice_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GITSLICE_TEST_DATABASE_URL: postgres://gitslice:gitslice@localhost:5432/gitslice_dev?sslmode=disable
      GITSLICE_LOAD_WORKERS: 8
      GITSLICE_LOAD_STATUS_ITERATIONS: 4
      GITSLICE_LOAD_TWO_SLICE_EDITS: 100

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run opt-in load tests
        run: go test -count=1 -tags load ./tests/load -v
