name: Mirror from Gitslice

# Phase 2 of design/21_self_hosting.md: Gitslice is the source of truth and
# main on GitHub is a read-only mirror. ops/mirror replays every new projected
# commit of gitslice/gitslice onto main and pushes new tags.
#
# The ruleset "main is a Gitslice mirror" lets only deploy keys update main,
# so the job pushes with the GITSLICE_EXPORT_DEPLOY_KEY deploy key. Pushes made
# with a deploy key (unlike GITHUB_TOKEN) trigger workflows: the exported
# commits start ci.yml and new version tags start release.yml.
#
# Enable with the repository variable GITSLICE_EXPORT_ENABLED=true (and turn
# GITSLICE_IMPORT_ENABLED off). GITSLICE_MIRROR_TOKEN is optional while the
# slice is public.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitslice-mirror
  cancel-in-progress: false

jobs:
  export:
    if: vars.GITSLICE_EXPORT_ENABLED == 'true' && vars.GITSLICE_IMPORT_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GITSLICE_EXPORT_DEPLOY_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Export Gitslice history to main
        env:
          GITSLICE_MIRROR_TOKEN: ${{ secrets.GITSLICE_MIRROR_TOKEN }}
          SOURCE: ${{ vars.GITSLICE_SOURCE_URL || 'https://gitslice.io/git/gitslice/gitslice.git' }}
        run: |
          go run ./ops/mirror -repo . -source "$SOURCE" -subdir gitslice/gitslice -push
