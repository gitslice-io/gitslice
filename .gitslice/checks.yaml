# Checks for the Gitslice source when it is hosted on Gitslice
# (design/17_continuous_integration.md, design/21_self_hosting.md,
# design/31_ci_daemon.md). They mirror .github/workflows/ci.yml and run in the
# image ci/Dockerfile builds, so a CI daemon needs only gs and Docker or Podman;
# it builds the image once and reuses it until ci/Dockerfile, go.mod or go.sum
# change.
version: 1

defaults:
  timeout: "20m"
  build:
    dockerfile: ci/Dockerfile
    inputs: [go.mod, go.sum]
  # Shared by every check here, so vet, test and build reuse each other's
  # compiled packages across runs.
  cache: ["/cache/go-build"]
  env:
    # A check runs on a fresh copy of the tree without any VCS metadata.
    # -buildvcs=false: go build (also inside the e2e tests) would otherwise
    # stamp from whatever .git sits above that copy, and fail when that is not
    # a real repository.
    # -trimpath: compiled files would otherwise record the copy's random path,
    # so every run filled the Go build cache with new entries.
    GOFLAGS: "-mod=readonly -buildvcs=false -trimpath"

services:
  # A fresh, empty database for each e2e run.
  postgres:
    image: postgres:16
    env:
      POSTGRES_HOST_AUTH_METHOD: trust
    ready: "pg_isready -U postgres -h 127.0.0.1"

checks:
  gofmt:
    description: "gofmt reports no unformatted Go files"
    run: 'files="$(gofmt -l $(find . -name "*.go" -not -path "./web/*"))"; if [ -n "$files" ]; then echo "$files"; exit 1; fi'
    paths: ["**/*.go"]

  vet:
    description: "go vet ./..."
    run: "go vet ./..."
    paths: ["**/*.go", "go.mod", "go.sum"]

  test:
    description: "Go unit tests"
    # The e2e check runs the Postgres suites; without the database URL they
    # skip here, as in GitHub's unit job, instead of running twice.
    run: "env -u GITSLICE_TEST_DATABASE_URL go test ./..."
    paths: ["**/*.go", "go.mod", "go.sum", "internal/postgres/migrations/**"]

  build:
    description: "Build the gs CLI and server"
    run: "go build ./cmd/..."
    paths: ["**/*.go", "go.mod", "go.sum"]

  e2e:
    description: "PostgreSQL storage, CLI and RPC end-to-end tests"
    services: [postgres]
    # Set in the command, not under env: a slice secret of the same name
    # would win over env and point elsewhere.
    run: 'GITSLICE_TEST_DATABASE_URL="postgres://postgres@postgres:5432/postgres?sslmode=disable" go test -count=1 ./internal/postgres ./tests/cli ./tests/rpc'
    paths: ["**/*.go", "go.mod", "go.sum", "internal/postgres/migrations/**"]
    timeout: "30m"
