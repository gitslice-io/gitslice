# Automations for the Gitslice source (design/34 & design/37).
version: 1

automations:
  # CI: the checks of .gitslice/checks.yaml run on the account's CI runner pool
  # for every new patchset. Each check's own paths still decide whether it runs.
  # The web app's checks have their own automation in web/.gitslice/automations.yaml.
  ci:
    description: Run Go formatting, vet, unit tests, builds, and Postgres e2e checks
    on: [changeset.created, changeset.updated, manual]
    action:
      check: [gofmt, vet, test, build, e2e]

  # Releases (design/21 "Releases"): a new vX.Y.Z tag (gs tag create) runs
  # the reporting worker ops/runbook.js, like the runbooks below. The ops
  # build runs the release pipeline (ops/release/cloudbuild.yaml), which
  # builds the tag and stores it in R2 for gitslice.io, and the run follows
  # it to the end: it fails when the release fails and links the build.
  # Other tags end the run at once. release and publish-releases share the
  # concurrency group releases.
  release:
    description: Build and publish a gs release when a vX.Y.Z tag is created
    on: [tag.created]
    secrets: [OPS_WEBHOOK_QUERY]
    network: [cloudbuild.googleapis.com]
    concurrency_group: releases
    timeout: 40m
    action:
      worker: ops/runbook.js

  # Deployment runbooks. Each runs the worker ops/runbook.js, which hands
  # the run to the Cloud Build webhook trigger gs-ops-webhook (ops/automation)
  # with the run's callback URL. The build holds the Google Cloud credentials,
  # runs only the operation named by the automation's id, and reports its
  # progress and result back to the run. Anyone who can submit to this slice
  # (writer or admin) can run them with `gs auto run <name> --follow` or from
  # the folder's Automation tab; no secret is shown to them, and the run
  # fails when the operation fails. deploy-server and rollback-server share
  # the concurrency group prod-server, so they never run at once.
  deploy-server:
    description: Build and deploy the server (Cloud Run gitslice-prod) from main, then move all traffic to the new revision
    on: [manual]
    manual:
      roles: [admin, writer]
      confirm: "Deploy main to production (gitslice-prod)?"
    secrets: [OPS_WEBHOOK_QUERY]
    network: [cloudbuild.googleapis.com]
    concurrency_group: prod-server
    timeout: 40m
    action:
      worker: ops/runbook.js

  rollback-server:
    description: Send all production traffic to an earlier server revision; the next deploy-server moves it back to the newest
    on: [manual]
    inputs:
      revision:
        type: string
        description: Cloud Run revision to serve, such as gitslice-prod-00147-xpj
        required: true
        pattern: "^gitslice-prod-[0-9]{5}-[a-z0-9]{3}$"
    manual:
      roles: [admin, writer]
      confirm: "Send all production traffic to this revision?"
    secrets: [OPS_WEBHOOK_QUERY]
    network: [cloudbuild.googleapis.com]
    concurrency_group: prod-server
    timeout: 15m
    action:
      worker: ops/runbook.js

  publish-releases:
    description: Build and publish every vX.Y.Z tag that is not on gitslice.io/releases yet (the daily release reconcile, now)
    on: [manual]
    manual:
      roles: [admin, writer]
    secrets: [OPS_WEBHOOK_QUERY]
    network: [cloudbuild.googleapis.com]
    concurrency_group: releases
    timeout: 40m
    action:
      worker: ops/runbook.js

  # Checks the runbook path end to end without touching production: the
  # worker hands the run to gs-ops-webhook, and the build reports back.
  ops-selftest:
    description: Check that the deployment runbooks reach Cloud Build and get its report back; changes nothing
    on: [manual]
    manual:
      roles: [admin, writer]
    secrets: [OPS_WEBHOOK_QUERY]
    network: [cloudbuild.googleapis.com]
    timeout: 10m
    action:
      worker: ops/runbook.js

  # Cloudflare runbooks: bash automations on Gitslice's own container runtime
  # (the dispatcher's BashRunner), running .gitslice/ops/cloudflare.sh from a
  # checkout of this folder. The Gitslice secret CLOUDFLARE_API_TOKEN reaches
  # them sealed; the gate opens it for api.cloudflare.com only. They share the
  # concurrency group prod-workers, so two never deploy at once.
  deploy-dispatcher:
    description: Deploy the automation dispatcher Worker (triggers.gitslice.io) from main, reusing its container images
    on: [manual]
    manual:
      roles: [admin, writer]
      confirm: "Deploy the automation dispatcher (it runs this very run) to production?"
    secrets: [CLOUDFLARE_API_TOKEN]
    network: [api.cloudflare.com, registry.npmjs.org]
    concurrency_group: prod-workers
    timeout: 15m
    action:
      bash:
        runtime: node
        size: standard-1
        checkout: folder
        env: {OP: deploy-dispatcher}
        script: ops/cloudflare.sh

  deploy-doorbell:
    description: Deploy the CI doorbell Worker (doorbell.gitslice.io) from main, with the Cloudflare CI runners off
    on: [manual]
    manual:
      roles: [admin, writer]
      confirm: "Deploy the CI doorbell to production?"
    secrets: [CLOUDFLARE_API_TOKEN]
    network: [api.cloudflare.com, registry.npmjs.org]
    concurrency_group: prod-workers
    timeout: 15m
    action:
      bash:
        runtime: node
        size: standard-1
        checkout: folder
        env: {OP: deploy-doorbell}
        script: ops/cloudflare.sh

  # The web app deploys from Gitslice itself: every landing that changes
  # web/ builds it in a container and deploys it with wrangler (not Workers
  # Builds, which built GitHub's mirror). There is no staging web app.
  deploy-web:
    description: Build the web app from main and deploy it to gitslice.io (on each landing that changes web/, or by hand)
    on: [push, manual]
    paths: [web/**]
    manual:
      roles: [admin, writer]
    secrets: [CLOUDFLARE_API_TOKEN]
    network: [api.cloudflare.com, registry.npmjs.org, gitslice.io]
    concurrency_group: prod-workers
    timeout: 15m
    action:
      bash:
        runtime: node
        size: standard-1
        checkout: folder
        env: {OP: deploy-web}
        script: ops/cloudflare.sh

  rollback-web:
    description: Serve an earlier version of the web app (gitslice.io); the next deploy-web or push to main moves it back
    on: [manual]
    inputs:
      version:
        type: string
        description: Worker version id of gitslice-web-production (deploy-web and the Cloudflare dashboard list them)
        required: true
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    manual:
      roles: [admin, writer]
      confirm: "Send all gitslice.io traffic to this version?"
    secrets: [CLOUDFLARE_API_TOKEN]
    network: [api.cloudflare.com, gitslice.io]
    concurrency_group: prod-workers
    timeout: 5m
    action:
      bash:
        runtime: node
        size: lite
        checkout: folder
        env: {OP: rollback-web}
        script: ops/cloudflare.sh

  # Checks the bash runbook path (container, gate, Cloudflare token) without
  # changing anything.
  cloudflare-selftest:
    description: Check that the Cloudflare runbooks start a container and reach Cloudflare through the gate; changes nothing
    on: [manual]
    manual:
      roles: [admin, writer]
    secrets: [CLOUDFLARE_API_TOKEN]
    network: [api.cloudflare.com]
    timeout: 5m
    action:
      bash:
        runtime: node
        size: lite
        checkout: folder
        env: {OP: cloudflare-selftest}
        script: ops/cloudflare.sh
