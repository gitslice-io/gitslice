# Automations for the Gitslice source (design/34 & design/37).
version: 1

automations:
  # CI: the checks of .gitslice/checks.yaml run on the account's CI runner pool
  # for every new patchset. Each check's own paths still decide whether it runs.
  # The web app's checks have their own automation in web/.gitslice/automations.yaml.
  ci:
    description: Run Go formatting, vet, unit tests, builds, and Postgres e2e checks
    on: [changeset.created, changeset.updated, manual]
    action:
      check: [gofmt, vet, test, build, e2e]

  # Releases: a new tag starts the Cloud Build release trigger
  # gs-release-webhook (ops/release, design/21 "Releases"), which builds the
  # release and stores it in R2 for gitslice.io. The URL carries its API key
  # and secret, so it is a Gitslice secret on /gitslice/gitslice.
  release:
    description: Trigger Cloud Build release pipeline on new version tags
    on: [tag.created]
    secrets: [RELEASE_WEBHOOK_URL]
    action:
      http:
        url: "${{ secrets.RELEASE_WEBHOOK_URL }}"

  # Deployment runbooks. Each posts its run to the Cloud Build webhook
  # trigger gs-ops-webhook (ops/automation), which holds the Google Cloud
  # credentials and runs only the operation named by the automation's id.
  # Anyone who can submit to this slice (writer or admin) can run them with
  # `gs auto run <name>` or from the folder's Automation tab, and no secret
  # is shown to them. The run's own status only says the webhook took it;
  # the build's log is in Cloud Build (gs-ops-webhook).
  deploy-server:
    description: Build and deploy the server (Cloud Run gitslice-prod) from main of the GitHub mirror, then move all traffic to the new revision
    on: [manual]
    manual:
      roles: [admin, writer]
      confirm: "Deploy main to production (gitslice-prod)?"
    secrets: [OPS_WEBHOOK_URL]
    action:
      http:
        url: "${{ secrets.OPS_WEBHOOK_URL }}"

  rollback-server:
    description: Send all production traffic to an earlier server revision; the next deploy-server moves it back to the newest
    on: [manual]
    inputs:
      revision:
        type: string
        description: Cloud Run revision to serve, such as gitslice-prod-00147-xpj
        required: true
        pattern: "^gitslice-prod-[0-9]{5}-[a-z0-9]{3}$"
    manual:
      roles: [admin, writer]
      confirm: "Send all production traffic to this revision?"
    secrets: [OPS_WEBHOOK_URL]
    action:
      http:
        url: "${{ secrets.OPS_WEBHOOK_URL }}"

  publish-releases:
    description: Build and publish every vX.Y.Z tag that is not on gitslice.io/releases yet (the daily release reconcile, now)
    on: [manual]
    manual:
      roles: [admin, writer]
    secrets: [OPS_WEBHOOK_URL]
    action:
      http:
        url: "${{ secrets.OPS_WEBHOOK_URL }}"

  # Checks the runbook path end to end without touching production: the
  # worker hands the run to gs-ops-webhook, and the build reports back.
  ops-selftest:
    description: Check that the deployment runbooks reach Cloud Build and get its report back; changes nothing
    on: [manual]
    manual:
      roles: [admin, writer]
    secrets: [OPS_WEBHOOK_QUERY]
    network: [cloudbuild.googleapis.com]
    timeout: 10m
    action:
      worker: ops/runbook.js
