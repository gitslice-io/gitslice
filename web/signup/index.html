<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gitslice Signup</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">Gitslice</div>
        <nav aria-label="Primary">
          <a aria-current="page" href="/signup/">Signup</a>
        </nav>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <span>Development signup</span>
          <span id="status-pill" class="pill">Ready</span>
        </header>
        <main class="content">
          <section class="panel signup-panel">
            <p class="eyebrow">Approve Account</p>
            <h1 id="signup-title">Approve signup</h1>
            <form id="signup-form">
              <label>
                Username
                <input id="username" name="username" autocomplete="username" readonly>
              </label>
              <label>
                API Gateway
                <input id="gateway-url" name="gateway-url" spellcheck="false" autocomplete="off">
              </label>
              <input id="callback-url" type="hidden" name="callback-url">
              <input id="state" type="hidden" name="state">
              <button id="approve-button" type="submit">Approve signup</button>
            </form>
            <p id="message" class="message" role="status"></p>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/signup/signup.js"></script>
  </body>
</html>
