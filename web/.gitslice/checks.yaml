# Web checks for the Gitslice source hosted on Gitslice; mirrors the "web" job
# in .github/workflows/ci.yml. Runs in the image web/ci/Dockerfile builds, which
# has the app's npm dependencies installed (design/31_ci_daemon.md).
version: 1

defaults:
  # Started by the ci trigger in web/.gitslice/triggers.yaml, not by every
  # patchset (design/34_triggers.md).
  started_by: trigger

checks:
  build:
    description: "Type-check, build and test the web app"
    build:
      dockerfile: ci/Dockerfile
      inputs: [package.json, package-lock.json]
    # The image's install, unless the tree brings its own (gs ci in a
    # workspace that ran npm ci).
    run: "[ -e node_modules ] || ln -s /deps/node_modules node_modules; npm run build && npm test"
    timeout: "20m"
